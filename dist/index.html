 * Mikke \u2014 single stylesheet (tokens + components)
 * \u65E2\u5B58\u306E\u5185\u88FD\u30C4\u30FC\u30EB\u306E\u30C8\u30FC\u30AF\u30F3\u3092\u8E0F\u8972\u3057\u3001\u30A2\u30AF\u30BB\u30F3\u30C8\u306E\u307F\u6DE1\u3044\u30D6\u30EB\u30FC\u306B\u5909\u66F4\u3002
 * \u5168\u30B3\u30F3\u30DD\u30FC\u30CD\u30F3\u30C8\u306F #mikke-root \u914D\u4E0B\u3001var() \u7D4C\u7531\u3067\u306E\u307F\u8272\u30FB\u5BF8\u6CD5\u3092\u53C2\u7167\u3002
 * ========================================================= */

#mikke-root {
  /* ---------- text ---------- */
  --ink:           #2a2a26;
  --ink-2:         #4a4842;
  --ink-3:         #7a766c;
  --ink-4:         #a8a39a;

  /* ---------- surface ---------- */
  --paper:         #fafaf7;
  --paper-2:       #f3f1ea;
  --paper-2-strong:#ece8de;
  --paper-3:       #e8e4d8;

  /* ---------- line ---------- */
  --line:          rgba(42, 42, 38, 0.12);
  --line-strong:   rgba(42, 42, 38, 0.18);

  /* ---------- accent (\u6DE1\u3044\u30D6\u30EB\u30FC / Mikke) ---------- */
  --accent:        #7b97c4;
  --accent-soft:   rgba(123, 151, 196, 0.18);
  --accent-strong: #5a76a3;

  /* ---------- status ---------- */
  --danger:        #b8534a;
  --warn:          #c47f1c;
  --ok:            #2f6f5e;
  --hl:            rgba(196, 174, 96, 0.35);

  /* ---------- type ---------- */
  --font-sans: "Meiryo", "\u30E1\u30A4\u30EA\u30AA", "Hiragino Sans", "Yu Gothic UI",
               -apple-system, "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "Cascadia Mono", "Consolas", monospace;

  --fs-xs:   11px; --fs-sm:   12px; --fs-md:   13px; --fs-base: 15px;
  --fs-lg:   16px; --fs-xl:   18px; --fs-h3:   22px; --fs-h2:   28px; --fs-h1: 36px;
  --lh-base:  1.7; --lh-tight: 1.35;

  /* ---------- spacing (4px base) ---------- */
  --s-1:  4px;  --s-2:  6px;  --s-3:  8px;  --s-4:  10px; --s-5:  12px;
  --s-6:  14px; --s-7:  18px; --s-8:  22px; --s-9:  28px; --s-10: 40px;
  --gutter: 32px;

  /* ---------- radius ---------- */
  --r-1: 2px; --r-2: 4px; --r-3: 6px; --r-4: 8px;

  /* ---------- shadow (warm, no blue) ---------- */
  --shadow-flyout: 0 12px 30px rgba(42, 42, 38, 0.14);
  --shadow-panel:  0 8px  20px rgba(42, 42, 38, 0.10);
  --shadow-modal:  0 0 0 1px rgba(42, 42, 38, 0.06),
                   0 4px  12px rgba(42, 42, 38, 0.10),
                   0 16px 40px rgba(42, 42, 38, 0.18);

  /* ---------- chrome metrics ---------- */
  --topbar-h:  44px;
  --side-w:    200px;
  --toolbar-h: 38px;

  /* ---------- z (numeric literals) ---------- */
  --z-overlay: 2147483600;
  --z-modal:   2147483700;
  --z-toast:   2147483800;

  /* ---------- base ---------- */
  font-family: var(--font-sans);
  font-size:   var(--fs-base);
  line-height: var(--lh-base);
  color:       var(--ink);
  background:  var(--paper);
  all: initial;            /* shield from SP host */
  font-family: var(--font-sans);
  color: var(--ink);
  /* \u2605 all:initial \u306F user-select \u3092 auto (=\u89AA\u306E\u5B9F\u52B9\u5024\u3092\u7D99\u627F) \u306B\u623B\u3059\u305F\u3081\u3001
     SP \u30DA\u30FC\u30B8\u5074\u306E user-select:none \u3092\u5F15\u304D\u7D99\u3044\u3067\u5168\u753B\u9762\u30B3\u30D4\u30FC\u4E0D\u53EF\u306B\u306A\u308B\u3002
     text \u3092\u660E\u793A\u3057\u3066\u30AA\u30FC\u30D0\u30FC\u30EC\u30A4\u5185\u306F\u5E38\u306B\u9078\u629E\u30FB\u30B3\u30D4\u30FC\u53EF\u80FD\u306B\u3059\u308B\u3002 */
  user-select: text;
  -webkit-user-select: text;

  position: fixed;
  inset: 0;
  z-index: 2147483600;
  background: var(--paper);
  overflow: hidden;
}

#mikke-root *,
#mikke-root *::before,
#mikke-root *::after { box-sizing: border-box; }

#mikke-root[data-theme="dark"] {
  --ink:        #e8e4d8;
  --ink-2:      #cfc9bd;
  --ink-3:      #a8a39a;
  --ink-4:      #7a766c;
  --paper:      #1d1b18;
  --paper-2:    #25231f;
  --paper-2-strong: #2c2a25;
  --paper-3:    #3a3731;
  --line:       rgba(232, 228, 216, 0.14);
  --line-strong:rgba(232, 228, 216, 0.22);
}

@media (prefers-reduced-motion: reduce) {
  #mikke-root * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ---------- shell ---------- */
#mikke-root .mikke-shell { display: flex; flex-direction: column; height: 100%; }
#mikke-root .mikke-body { display: flex; flex: 1; min-height: 0; }
#mikke-root .mikke-main { flex: 1; min-width: 0; overflow: auto; display: flex; flex-direction: column; }

/* ---------- topbar ---------- */
#mikke-root .mikke-topbar {
  display: flex; align-items: center; gap: var(--s-3);
  height: var(--topbar-h); padding: 0 var(--gutter);
  border-bottom: 1px solid var(--line); background: var(--paper-2);
  flex-shrink: 0;
}
#mikke-root .mikke-topbar-brand {
  display: inline-flex; align-items: center; gap: var(--s-2);
  font-weight: 700; font-size: var(--fs-lg); color: var(--ink); letter-spacing: -0.01em;
}
#mikke-root .mikke-brand-mark { width: 22px; height: 22px; color: var(--accent); display: inline-flex; }
#mikke-root .mikke-brand-mark svg { width: 100%; height: 100%; }
#mikke-root .mikke-topbar-spacer { flex: 1; }
#mikke-root .mikke-topbar-actions { display: inline-flex; align-items: center; gap: var(--s-2); }
#mikke-root .mikke-topbar-site {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: 4px 10px; background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-2); color: var(--ink-2); font-size: var(--fs-xs);
  text-decoration: none; max-width: 280px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}

/* ---------- sidebar ---------- */
#mikke-root .mikke-side {
  width: var(--side-w); flex-shrink: 0; border-right: 1px solid var(--line);
  background: var(--paper-2); display: flex; flex-direction: column;
  padding: var(--s-4) 0;
}
#mikke-root .mikke-nav-item {
  display: flex; align-items: center; gap: var(--s-3);
  padding: var(--s-3) var(--s-5); margin: 1px var(--s-3);
  border-radius: var(--r-2); cursor: pointer; color: var(--ink-2);
  font-size: var(--fs-md); border-left: 2px solid transparent;
}
#mikke-root .mikke-nav-item:hover { background: var(--paper-2-strong); }
#mikke-root .mikke-nav-item.is-active {
  background: var(--accent-soft); color: var(--ink); border-left-color: var(--accent);
}
#mikke-root .mikke-nav-item svg { width: 16px; height: 16px; flex-shrink: 0; }
/* SP \u306E\u30EA\u30B9\u30C8\u3092\u5225\u30BF\u30D6\u3067\u958B\u304F\u5916\u90E8\u30EA\u30F3\u30AF (Mikke \u306E\u753B\u9762\u9077\u79FB\u3067\u306F\u306A\u3044\u306E\u3067\u63A7\u3048\u3081\u306B) */
#mikke-root .mikke-nav-item--external { text-decoration: none; color: var(--ink-3); }
#mikke-root .mikke-nav-item--external:hover { color: var(--ink-2); }
/* \u8868\u30BB\u30EB\u5185\u306E\u30EA\u30F3\u30AF (\u500B\u5225\u30EC\u30DD\u30FC\u30C8\u3092\u958B\u304F\u7B49)\u3002\u884C\u30AF\u30EA\u30C3\u30AF\u3068\u533A\u5225\u3067\u304D\u308B\u3088\u3046\u4E0B\u7DDA\u3092\u4ED8\u3051\u308B */
#mikke-root .mikke-link { color: var(--accent-strong); text-decoration: underline; cursor: pointer; }
#mikke-root .mikke-nav-ext { margin-left: auto; display: inline-flex; opacity: 0.6; }
#mikke-root .mikke-nav-ext svg { width: 12px; height: 12px; }
#mikke-root .mikke-side-foot {
  margin-top: auto; padding: var(--s-4) var(--s-5); font-size: var(--fs-xs); color: var(--ink-4);
}

/* ---------- buttons ---------- */
#mikke-root .mikke-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--s-2);
  height: 34px; padding: 0 var(--s-7); border: 1px solid transparent;
  border-radius: var(--r-2); font-family: var(--font-sans); font-size: var(--fs-md);
  cursor: pointer; white-space: nowrap;
}
#mikke-root .mikke-btn--primary { background: var(--accent); color: #fff; }
#mikke-root .mikke-btn--primary:hover { background: var(--accent-strong); }
#mikke-root .mikke-btn--secondary { background: var(--paper-2); color: var(--ink); border-color: var(--line); }
#mikke-root .mikke-btn--secondary:hover { background: var(--paper-2-strong); }
#mikke-root .mikke-btn--ghost { background: transparent; color: var(--ink-3); }
#mikke-root .mikke-btn--ghost:hover { background: var(--paper-2); }
#mikke-root .mikke-btn--danger { background: transparent; color: var(--danger); border-color: var(--danger); }
#mikke-root .mikke-btn[disabled] { opacity: 0.4; cursor: default; }
#mikke-root .mikke-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
#mikke-root .mikke-iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 30px; height: 30px; border: 0; background: transparent; cursor: pointer;
  border-radius: var(--r-2); color: var(--ink-2);
}
#mikke-root .mikke-iconbtn:hover { background: var(--paper-2-strong); }
#mikke-root .mikke-iconbtn svg { width: 18px; height: 18px; }

/* ---------- subbar / toolbar ---------- */
#mikke-root .mikke-subbar {
  display: flex; align-items: center; gap: var(--s-3);
  min-height: 42px; padding: var(--s-3) var(--gutter);
  border-bottom: 1px solid var(--line);
}
#mikke-root .mikke-subbar-title { font-size: var(--fs-lg); font-weight: 600; }
#mikke-root .mikke-subbar-count { color: var(--ink-3); font-size: var(--fs-sm); }
#mikke-root .mikke-toolbar {
  display: flex; align-items: center; gap: var(--s-3); flex-wrap: wrap;
  min-height: var(--toolbar-h); padding: var(--s-2) var(--gutter);
  border-bottom: 1px solid var(--line); background: var(--paper);
}
#mikke-root .mikke-input, #mikke-root .mikke-select {
  /* min-height \u306B\u3059\u308B\u3053\u3068\u3067\u3001.mikke-field select \u306E\u7E26 padding \u3068\u56FA\u5B9A height \u304C
     \u885D\u7A81\u3057\u3066\u3082\u5185\u5BB9\u9818\u57DF\u304C\u6F70\u308C\u306A\u3044 (border-box \u3067\u6587\u5B57\u304C\u7E26\u306B\u5207\u308C\u308B\u4E0D\u5177\u5408\u306E\u4FEE\u6B63)\u3002 */
  min-height: 30px; padding: 0 var(--s-3); border: 1px solid transparent;
  background: transparent; border-radius: var(--r-2); color: var(--ink);
  font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.4;
}
#mikke-root .mikke-input:focus, #mikke-root .mikke-select:focus {
  outline: none; background: var(--paper); border-color: var(--line-strong);
}
#mikke-root .mikke-input::placeholder { color: var(--ink-4); }

/* ---------- table ---------- */
#mikke-root .mikke-table-wrap { flex: 1; overflow: auto; padding: 0 var(--gutter) var(--gutter); }
#mikke-root .mikke-table { width: 100%; border-collapse: collapse; font-size: var(--fs-md); }
#mikke-root .mikke-table th {
  position: sticky; top: 0; z-index: 1; background: var(--paper-2);
  text-align: left; padding: var(--s-3) var(--s-5); font-weight: 600;
  color: var(--ink-2); border-bottom: 1px solid var(--line-strong); white-space: nowrap;
  cursor: pointer; user-select: none;
}
#mikke-root .mikke-table td {
  padding: var(--s-3) var(--s-5); border-bottom: 1px solid var(--line); vertical-align: middle;
}
#mikke-root .mikke-table tbody tr { cursor: pointer; }
#mikke-root .mikke-table tbody tr:hover { background: var(--paper-2); }
#mikke-root .mikke-table tbody tr.is-selected { background: var(--accent-soft); }
#mikke-root .mikke-check-col { width: 38px; text-align: center; }
/* \u5217\u5E45\u30EA\u30B5\u30A4\u30BA\u7528\u30B0\u30EA\u30C3\u30D7 (th \u53F3\u7AEF\u3002th \u306F sticky=positioned \u306A\u306E\u3067 absolute \u306E\u57FA\u6E96\u306B\u306A\u308B) */
#mikke-root .mikke-col-grip {
  position: absolute; top: 0; right: -4px; width: 9px; height: 100%;
  cursor: col-resize; user-select: none; z-index: 2;
}
#mikke-root .mikke-col-grip:hover { background: var(--accent-soft); }

/* ---------- badges ---------- */
#mikke-root .mikke-badge {
  display: inline-flex; align-items: center; padding: 2px var(--s-3);
  border-radius: 999px; font-size: var(--fs-xs); font-weight: 600;
  background: var(--paper-2-strong); color: var(--ink-3); white-space: nowrap;
}
#mikke-root .mikke-badge--accent { background: var(--accent-soft); color: var(--accent-strong); }
#mikke-root .mikke-badge--ok     { background: rgba(47,111,94,0.15); color: var(--ok); }
#mikke-root .mikke-badge--warn   { background: rgba(196,127,28,0.15); color: var(--warn); }
#mikke-root .mikke-badge--danger { background: rgba(184,83,74,0.15); color: var(--danger); }
#mikke-root .mikke-badge--muted  { background: var(--paper-2-strong); color: var(--ink-4); }

/* ---------- tab strip (detail) ---------- */
#mikke-root .mikke-tabstrip { display: flex; gap: 2px; padding: var(--s-2) var(--gutter) 0; border-bottom: 1px solid var(--line); }
#mikke-root .mikke-tab {
  display: inline-flex; align-items: center; gap: var(--s-2);
  padding: var(--s-2) var(--s-4); border: 1px solid transparent; border-bottom: none;
  border-radius: var(--r-2) var(--r-2) 0 0; cursor: pointer; font-size: var(--fs-md);
  background: var(--paper-2); color: var(--ink-4);
}
#mikke-root .mikke-tab:hover { background: var(--paper-2-strong); color: var(--ink-2); }
#mikke-root .mikke-tab.is-active {
  background: var(--paper); border-color: var(--line); color: var(--ink); font-weight: 600;
  box-shadow: inset 0 2px 0 var(--accent);
}
#mikke-root .mikke-detail-tabs { display: flex; gap: var(--s-2); padding: var(--s-3) var(--gutter) 0; }
#mikke-root .mikke-detail-tab { padding: var(--s-2) var(--s-4); cursor: pointer; color: var(--ink-3); border-bottom: 2px solid transparent; }
#mikke-root .mikke-detail-tab.is-active { color: var(--ink); border-bottom-color: var(--accent); }
#mikke-root .mikke-detail-body { padding: var(--gutter); overflow: auto; }

/* ---------- meta grid (detail / overview) ---------- */
#mikke-root .mikke-meta { display: grid; grid-template-columns: 140px 1fr; gap: var(--s-3) var(--s-5); max-width: 720px; }
#mikke-root .mikke-meta-label { color: var(--ink-3); font-size: var(--fs-sm); }
#mikke-root .mikke-meta-value { color: var(--ink); }

/* ---------- modal ---------- */
#mikke-root .mikke-modal-backdrop {
  position: fixed; inset: 0; background: rgba(15,15,15,0.45);
  backdrop-filter: blur(2px); z-index: 2147483700;
  display: flex; align-items: center; justify-content: center;
}
#mikke-root .mikke-modal {
  background: var(--paper); border-radius: var(--r-4); box-shadow: var(--shadow-modal);
  width: min(640px, calc(100vw - 80px)); max-height: calc(100vh - 80px);
  display: flex; flex-direction: column; overflow: hidden;
}
#mikke-root .mikke-modal--lg { width: min(820px, calc(100vw - 80px)); }
#mikke-root .mikke-modal--xl { width: min(1000px, calc(100vw - 80px)); height: calc(100vh - 80px); resize: both; }
#mikke-root .mikke-modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: var(--s-5) var(--s-7); border-bottom: 1px solid var(--line);
}
#mikke-root .mikke-modal-title { margin: 0; font-size: var(--fs-xl); font-weight: 600; }
#mikke-root .mikke-modal-body { padding: var(--s-7); overflow: auto; flex: 1; }
#mikke-root .mikke-modal-footer {
  display: flex; align-items: center; justify-content: flex-end; gap: var(--s-3);
  padding: var(--s-5) var(--s-7); border-top: 1px solid var(--line);
}

/* ---------- form field ---------- */
#mikke-root .mikke-field { margin-bottom: var(--s-6); }
#mikke-root .mikke-field-label { display: block; margin-bottom: var(--s-2); font-size: var(--fs-sm); color: var(--ink-2); }
#mikke-root .mikke-field input[type="text"], #mikke-root .mikke-field input[type="date"],
#mikke-root .mikke-field select, #mikke-root .mikke-field textarea {
  width: 100%; padding: var(--s-3); border: 1px solid var(--line-strong);
  border-radius: var(--r-2); background: var(--paper); color: var(--ink);
  font-family: var(--font-sans); font-size: var(--fs-md);
}
#mikke-root .mikke-field textarea { min-height: 80px; resize: vertical; }

/* ---------- \u753B\u50CF\u8CBC\u4ED8\u30A8\u30C7\u30A3\u30BF (\u7279\u5B9A\u6839\u62E0 / \u5099\u8003) ---------- */
#mikke-root .mikke-imgedit {
  width: 100%; min-height: 80px; padding: var(--s-3);
  border: 1px solid var(--line-strong); border-radius: var(--r-2);
  background: var(--paper); color: var(--ink);
  font-family: var(--font-sans); font-size: var(--fs-md); line-height: 1.6;
  overflow-y: auto; max-height: 320px; outline: none;
}
#mikke-root .mikke-imgedit:focus { border-color: var(--accent); }
#mikke-root .mikke-imgedit:empty::before {
  content: attr(data-placeholder); color: var(--ink-4); pointer-events: none;
}
#mikke-root .mikke-imgedit img { max-width: 100%; height: auto; border-radius: var(--r-1); margin: var(--s-1) 0; }
#mikke-root .mikke-imgedit.is-drop { border-color: var(--accent); background: rgba(123,151,196,0.08); }
#mikke-root .mikke-imgedit-hint { margin-top: var(--s-1); font-size: var(--fs-sm); color: var(--ink-4); }
/* \u30C6\u30FC\u30D6\u30EB\u30BB\u30EB\u5185\u306E \u7279\u5B9A\u6839\u62E0 / \u5099\u8003 \u30D7\u30EC\u30D3\u30E5\u30FC (\u753B\u50CF\u306F\u5C0F\u3055\u3081) */
#mikke-root .mikke-cell-rich img { max-height: 2.4em; width: auto; vertical-align: middle; border-radius: var(--r-1); }

/* ---------- \u30C0\u30A6\u30F3\u30ED\u30FC\u30C9\u53D6\u5F97: \u5BFE\u8C61\u9078\u629E ---------- */
#mikke-root .mikke-dl-picks { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-2) var(--s-5); }
#mikke-root .mikke-dl-pick {
  display: flex; align-items: center; gap: var(--s-3); padding: var(--s-2) 0;
  cursor: pointer; user-select: none; font-size: var(--fs-md); color: var(--ink);
}
#mikke-root .mikke-dl-pick input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }

/* ---------- empty / loading / error ---------- */
#mikke-root .mikke-empty { text-align: center; padding: var(--s-10); color: var(--ink-3); }
#mikke-root .mikke-empty-title { font-size: var(--fs-lg); color: var(--ink-2); margin-bottom: var(--s-3); }
#mikke-root .mikke-error {
  margin: var(--s-4) var(--gutter); padding: var(--s-4); border: 1px solid var(--danger);
  border-radius: var(--r-2); color: var(--danger); background: rgba(184,83,74,0.08); user-select: text;
}

/* ---------- toast ---------- */
#mikke-root .mikke-toast-stack {
  position: fixed; top: var(--s-6); right: var(--s-6); z-index: 2147483800;
  display: flex; flex-direction: column; gap: var(--s-3); max-width: 360px;
}
#mikke-root .mikke-toast {
  padding: var(--s-4) var(--s-5); border-radius: var(--r-3);
  background: var(--paper); box-shadow: var(--shadow-flyout);
  border: 1px solid var(--line); font-size: var(--fs-md); color: var(--ink);
}
#mikke-root .mikke-toast--ok     { border-left: 3px solid var(--ok); }
#mikke-root .mikke-toast--warn   { border-left: 3px solid var(--warn); }
#mikke-root .mikke-toast--error  { border-left: 3px solid var(--danger); }

/* ---------- CSV import dropzone (F1) ---------- */
/* display:none \u3060\u3068\u4E00\u90E8\u30D6\u30E9\u30A6\u30B6/\u74B0\u5883\u3067 input.click() \u304C\u30D5\u30A1\u30A4\u30EB\u30C0\u30A4\u30A2\u30ED\u30B0\u3092
   \u958B\u304B\u306A\u3044\u3053\u3068\u304C\u3042\u308B\u305F\u3081\u3001\u30EC\u30A4\u30A2\u30A6\u30C8\u306B\u306F\u6B8B\u3059\u300C\u8996\u899A\u7684\u975E\u8868\u793A\u300D\u306B\u3059\u308B\u3002 */
#mikke-root .mikke-dropzone-input {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
#mikke-root .mikke-dropzone {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: var(--s-4); text-align: center;
  padding: var(--s-9) var(--s-7);
  border: 2px dashed var(--line-strong); border-radius: var(--r-4);
  background: var(--paper-2); cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
#mikke-root .mikke-dropzone:hover { border-color: var(--accent); background: var(--paper); }
#mikke-root .mikke-dropzone.is-dragover {
  border-style: solid; border-color: var(--accent); background: var(--accent-soft);
}
#mikke-root .mikke-dropzone-icon { color: var(--accent); display: inline-flex; }
#mikke-root .mikke-dropzone-icon svg { width: var(--s-10); height: var(--s-10); }
#mikke-root .mikke-dropzone-title { font-size: var(--fs-base); color: var(--ink); }
#mikke-root .mikke-dropzone-title b { color: var(--accent-strong); font-weight: 600; }
#mikke-root .mikke-dropzone-hint { font-size: var(--fs-sm); color: var(--ink-4); }

/* ---------- \u5168\u6587\u8868\u793A\u30C8\u30B0\u30EB (\u6298\u308A\u8FD4\u3057) ---------- */
/* OFF: 1 \u884C\u306B\u5207\u308A\u8A70\u3081\u3066\u884C\u306E\u9AD8\u3055\u3092\u63C3\u3048\u308B\u3002
   \u2605 \u63C3\u3048\u306A\u3044\u3068\u9577\u3044\u5024\u306E\u3042\u308B\u884C\u3060\u3051\u4F38\u3073\u3066\u8AAD\u307F\u306B\u304F\u304F\u3001\u4EEE\u60F3\u30B9\u30AF\u30ED\u30FC\u30EB\u306E\u4F4D\u7F6E\u8A08\u7B97
     (1 \u884C = \u56FA\u5B9A\u9AD8\u3055\u524D\u63D0) \u3082\u305A\u308C\u308B\u3002\u5168\u6587\u306F\u300C\u5168\u6587\u8868\u793A\u300DON \u304B\u8A73\u7D30\u753B\u9762\u3067\u898B\u308B\u3002
   \u2605 max-width:0 \u306F table \u30BB\u30EB\u3067 text-overflow \u3092\u52B9\u304B\u305B\u308B\u305F\u3081\u306E\u5B9A\u77F3
     (th \u306E width \u6307\u5B9A\u304C\u5B9F\u52B9\u5024\u306B\u306A\u308B)\u3002 */
#mikke-root .mikke-table:not(.mikke-wrap) td {
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 0;
}
/* \u4E2D\u8EAB\u304C\u7E26\u306B\u4F38\u3073\u308B\u8981\u7D20 (\u30EA\u30C3\u30C1\u30C6\u30AD\u30B9\u30C8\u306E\u30D7\u30EC\u30D3\u30E5\u30FC\u7B49) \u3082 1 \u884C\u306B\u53CE\u3081\u308B\u3002 */
#mikke-root .mikke-table:not(.mikke-wrap) td > div {
  max-height: 1.6em; overflow: hidden;
}
#mikke-root .mikke-table:not(.mikke-wrap) .mikke-cell-rich {
  white-space: nowrap; text-overflow: ellipsis;
}
/* \u2605 \u30EA\u30C3\u30C1\u30C6\u30AD\u30B9\u30C8\u306F <p> \u7B49\u306E\u30D6\u30ED\u30C3\u30AF\u3092\u542B\u3080\u305F\u3081\u3001\u305D\u306E\u307E\u307E\u3060\u3068 2 \u884C\u76EE\u4EE5\u964D\u304C
   \u884C\u306E\u9AD8\u3055\u3067\u5207\u308C\u3066\u300C\u6587\u5B57\u306E\u9014\u4E2D\u3067\u5207\u308C\u305F\u300D\u898B\u305F\u76EE\u306B\u306A\u308B\u3002\u975E\u6298\u308A\u8FD4\u3057\u6642\u306F\u4E2D\u8EAB\u3092
   inline \u306B\u3057\u3066 1 \u884C\u306B\u6D41\u3057\u3001\u306F\u307F\u51FA\u3057\u5206\u306F\u7701\u7565\u8A18\u53F7\u306B\u3059\u308B\u3002 */
#mikke-root .mikke-table:not(.mikke-wrap) .mikke-cell-rich > * {
  display: inline; margin: 0; padding: 0;
}
#mikke-root .mikke-table:not(.mikke-wrap) .mikke-cell-rich br { display: none; }
#mikke-root .mikke-table:not(.mikke-wrap) .mikke-cell-rich img {
  max-height: 1.4em; vertical-align: middle;
}
#mikke-root .mikke-table.mikke-wrap td {
  white-space: normal; overflow: visible; text-overflow: clip;
  overflow-wrap: anywhere; word-break: break-word; vertical-align: top;
}
/* ---------- \u4EEE\u60F3\u30B9\u30AF\u30ED\u30FC\u30EB\u306E\u30B9\u30DA\u30FC\u30B5\u884C ---------- */
#mikke-root .mikke-table tbody tr.mikke-vspacer:hover { background: transparent; }
#mikke-root .mikke-table tbody tr.mikke-vspacer td { padding: 0; border: 0; }
/* ---------- \u5217\u30D8\u30C3\u30C0\u306E\u30D5\u30A3\u30EB\u30BF/\u4E26\u3079\u66FF\u3048\u30E1\u30CB\u30E5\u30FC ---------- */
#mikke-root .mikke-th-caret {
  display: inline-flex; vertical-align: middle; margin-left: 4px; opacity: 0.45;
  width: 12px; height: 12px;
}
#mikke-root .mikke-th-caret svg { width: 12px; height: 12px; }
#mikke-root .mikke-th-active { color: var(--accent-strong); opacity: 1; }
#mikke-root .mikke-th-dragging { opacity: 0.4; background: var(--accent-soft); }
#mikke-root .mikke-col-dropline { position: fixed; width: 2px; background: var(--accent); z-index: 60; pointer-events: none; }
#mikke-root .mikke-colmenu {
  position: fixed; z-index: 50; width: 260px; max-height: 460px;
  display: flex; flex-direction: column;
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--r-2); box-shadow: var(--shadow-flyout); overflow: hidden;
}
#mikke-root .mikke-colmenu-act {
  display: flex; align-items: center; gap: var(--s-3); width: 100%; text-align: left;
  padding: var(--s-3) var(--s-4); background: transparent; border: 0; cursor: pointer;
  font-size: var(--fs-sm); color: var(--ink); font-family: inherit;
}
#mikke-root .mikke-colmenu-act:hover { background: var(--paper-2); }
#mikke-root .mikke-colmenu-sep { height: 1px; background: var(--line); margin: var(--s-2) 0; }
#mikke-root .mikke-colmenu-search {
  margin: var(--s-3); padding: var(--s-2) var(--s-3); border: 1px solid var(--line-strong);
  border-radius: var(--r-2); font-size: var(--fs-sm); font-family: inherit;
}
#mikke-root .mikke-colmenu-search:focus { outline: none; border-color: var(--accent); }
#mikke-root .mikke-colmenu-vlist { flex: 1; overflow: auto; padding: 0 var(--s-2) var(--s-2); }
#mikke-root .mikke-colmenu-item {
  display: flex; align-items: center; gap: var(--s-3); padding: 3px var(--s-3);
  cursor: pointer; font-size: var(--fs-sm); border-radius: var(--r-2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#mikke-root .mikke-colmenu-item:hover { background: var(--paper-2); }
#mikke-root .mikke-colmenu-item span { overflow: hidden; text-overflow: ellipsis; }
#mikke-root .mikke-colmenu-all { border-bottom: 1px solid var(--line); margin-bottom: var(--s-2); font-weight: 600; }
#mikke-root .mikke-colmenu-note { padding: var(--s-2) var(--s-3); color: var(--ink-4); font-size: var(--fs-xs); }

/* ---------- \u5BFE\u5FDC\u5C65\u6B74\u30AB\u30FC\u30C9 ---------- */
#mikke-root .mikke-hist-list { display: flex; flex-direction: column; gap: var(--s-5); }
#mikke-root .mikke-hist-card {
  border: 1px solid var(--line); border-radius: var(--r-3); padding: var(--s-5);
  background: var(--paper-2);
}
#mikke-root .mikke-hist-card[data-thread="internal"] {
  background: rgba(122, 138, 120, 0.10); border-color: rgba(122, 138, 120, 0.30);
}
#mikke-root .mikke-hist-head {
  display: flex; align-items: center; gap: var(--s-3); margin-bottom: var(--s-3);
  font-size: var(--fs-sm); color: var(--ink-3);
}
#mikke-root .mikke-hist-icon { display: inline-flex; color: var(--ink-4); }
#mikke-root .mikke-hist-icon svg { width: 15px; height: 15px; }
#mikke-root .mikke-hist-from { color: var(--ink); font-weight: 600; }
#mikke-root .mikke-hist-email { color: var(--ink-4); font-size: var(--fs-xs); }
#mikke-root .mikke-hist-date { color: var(--ink-4); font-size: var(--fs-xs); }
#mikke-root .mikke-hist-subject { font-weight: 600; margin-bottom: var(--s-2); color: var(--ink); }
#mikke-root .mikke-hist-body {
  font-size: var(--fs-md); line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: var(--ink);
}
#mikke-root .mikke-hist-quoted {
  margin-top: var(--s-3); padding-left: var(--s-4); border-left: 3px solid var(--line-strong);
  color: var(--ink-3); font-size: var(--fs-sm); line-height: 1.7; white-space: pre-wrap; word-break: break-word;
}
#mikke-root .mikke-hist-toggle {
  margin-top: var(--s-3); padding: 3px 12px; background: var(--paper); border: 1px solid var(--line);
  border-radius: 999px; font-family: inherit; font-size: var(--fs-xs); color: var(--ink-3); cursor: pointer;
}
#mikke-root .mikke-hist-drop {
  margin: var(--s-4) 0; padding: var(--s-5); border: 1.5px dashed var(--line-strong);
  border-radius: var(--r-3); text-align: center; color: var(--ink-3); font-size: var(--fs-sm);
  background: var(--paper-2); transition: border-color 0.15s, background 0.15s;
}
#mikke-root .mikke-hist-drop.is-over { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }

/* ---------- \u66F4\u65B0\u5C65\u6B74 (\u65E5\u5225\u30AB\u30FC\u30C9) ---------- */
#mikke-root .mikke-changelog-day {
  font-weight: 600; color: var(--ink-2); font-size: var(--fs-sm);
  padding-bottom: var(--s-2); margin-bottom: var(--s-2); border-bottom: 1px solid var(--line);
}
#mikke-root .mikke-changelog-row {
  display: flex; align-items: flex-start; gap: var(--s-3); padding: var(--s-2) 0; line-height: 1.7;
}
#mikke-root .mikke-changelog-time { color: var(--ink-4); font-size: var(--fs-xs); white-space: nowrap; min-width: 92px; }

/* ---------- \u30C9\u30ED\u30C3\u30D7\u30C0\u30A6\u30F3\u30E1\u30CB\u30E5\u30FC\u9805\u76EE ---------- */
#mikke-root .mikke-menu-item {
  display: block; width: 100%; text-align: left; padding: var(--s-3) var(--s-4);
  background: transparent; border: 0; border-radius: var(--r-2); cursor: pointer;
  font-size: var(--fs-sm); color: var(--ink); font-family: inherit;
}
#mikke-root .mikke-menu-item:hover { background: var(--paper-2); }

/* ---------- file picker (\u30E2\u30FC\u30C0\u30EB\u5185\u306E\u30B3\u30F3\u30D1\u30AF\u30C8\u306A\u30D5\u30A1\u30A4\u30EB\u9078\u629E\u30D5\u30A3\u30FC\u30EB\u30C9) ---------- */
#mikke-root .mikke-filefield {
  display: flex; align-items: center; gap: var(--s-4);
  padding: var(--s-4) var(--s-5);
  border: 1.5px dashed var(--line-strong); border-radius: var(--r-3);
  background: var(--paper-2); cursor: pointer;
  transition: border-color 0.15s ease, background 0.15s ease;
}
#mikke-root .mikke-filefield:hover { border-color: var(--accent); background: var(--paper); }
#mikke-root .mikke-filefield.is-dragover {
  border-style: solid; border-color: var(--accent); background: var(--accent-soft);
}
#mikke-root .mikke-filefield.is-selected { border-style: solid; border-color: var(--accent); background: var(--paper); }
#mikke-root .mikke-filefield-icon { color: var(--accent); display: inline-flex; flex-shrink: 0; }
#mikke-root .mikke-filefield-icon svg { width: 20px; height: 20px; }
#mikke-root .mikke-filefield-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
#mikke-root .mikke-filefield-name {
  font-size: var(--fs-md); color: var(--ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#mikke-root .mikke-filefield.is-selected .mikke-filefield-name { color: var(--accent-strong); font-weight: 600; }
#mikke-root .mikke-filefield-hint { font-size: var(--fs-xs); color: var(--ink-4); }

/* ---------- progress (CSV \u53D6\u8FBC\u306E\u66F8\u304D\u8FBC\u307F\u9032\u6357) ---------- */
#mikke-root .mikke-progress {
  width: min(420px, 100%); height: 8px; margin: 0 auto;
  background: var(--paper-2-strong); border-radius: 999px; overflow: hidden;
}
#mikke-root .mikke-progress-bar {
  height: 100%; width: 0%; background: var(--accent);
  border-radius: 999px; transition: width 0.15s ease;
}

/* ---------- settings (master-detail) ---------- */
#mikke-root .mikke-settings { display: flex; height: 100%; }
#mikke-root .mikke-settings-nav { width: 200px; border-right: 1px solid var(--line); padding: var(--s-4) 0; }
#mikke-root .mikke-settings-detail { flex: 1; padding: var(--gutter); overflow: auto; }
#mikke-root .mikke-cond-row { display: flex; gap: var(--s-2); align-items: center; margin-bottom: var(--s-3); }
/* F7 \u6761\u4EF6\u306E\u30C9\u30E9\u30C3\u30B0\u4E26\u3079\u66FF\u3048 */
/* \u30CF\u30F3\u30C9\u30EB\u306F\u63A7\u3048\u3081\u306A \u283F (\u67A0/\u80CC\u666F\u306A\u3057)\u3002\u63B4\u307F\u3084\u3059\u3055\u306E\u305F\u3081\u5F53\u305F\u308A\u5224\u5B9A\u3092\u884C\u9AD8\xD7\u5E45\u5E83\u306B
   \u53D6\u308A\u3001hover \u3067\u8584\u304F\u80CC\u666F\u3092\u51FA\u3057\u3066\u300C\u63B4\u3081\u308B\u5834\u6240\u300D\u3092\u660E\u793A\u3059\u308B (\u5E38\u6642\u306E\u67A0\u306F\u4ED8\u3051\u306A\u3044)\u3002 */
#mikke-root .mikke-cond-grip {
  cursor: grab; color: var(--ink-3); user-select: none;
  display: inline-flex; align-items: center; justify-content: center;
  align-self: stretch; min-width: 26px; padding: 0 var(--s-2);
  font-size: var(--fs-md); line-height: 1; border-radius: var(--r-2);
  flex-shrink: 0;
}
#mikke-root .mikke-cond-grip:hover { background: var(--paper-2-strong); color: var(--ink); }
#mikke-root .mikke-cond-grip:active { cursor: grabbing; }
/* \u30C9\u30ED\u30C3\u30D7\u4F4D\u7F6E (\u633F\u5165\u70B9)\u3002\u30C9\u30E9\u30C3\u30B0\u4E2D\u306F\u5168\u5019\u88DC\u3092\u7834\u7DDA\u30C8\u30E9\u30C3\u30AF\u3067\u53EF\u8996\u5316\u3057\u3001
   \u30DB\u30D0\u30FC\u4E2D\u306E\u4F4D\u7F6E\u3092\u30A2\u30AF\u30BB\u30F3\u30C8\u8272\u306E\u30D0\u30FC\u3067\u660E\u793A\u3059\u308B\u3002 */
#mikke-root .mikke-cond-drop { height: 4px; border-radius: 999px; margin: 2px 0; }
#mikke-root .mikke-cond-tree.is-dragging .mikke-cond-drop {
  height: 14px; margin: var(--s-2) 0; border: 1px dashed var(--line-strong);
  border-radius: var(--r-2); background: var(--paper-2);
}
#mikke-root .mikke-cond-tree.is-dragging .mikke-cond-drop.is-over {
  background: var(--accent); border: 1px solid var(--accent-strong);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
/* \u30C9\u30E9\u30C3\u30B0\u4E2D\u306E\u30B0\u30EB\u30FC\u30D7: \u81EA\u5206\u306E\u5185\u90E8\u30C9\u30ED\u30C3\u30D7\u30BE\u30FC\u30F3\u306F\u7121\u52B9 (\u975E\u8868\u793A)\u3001\u672C\u4F53\u306F\u6DE1\u304F\u3002 */
#mikke-root .mikke-cond-group.is-drag-src { opacity: 0.45; }
#mikke-root .mikke-cond-group.is-drag-src .mikke-cond-drop { display: none; }

# \u2500\u2500\u2500 .env \u8AAD\u307F\u8FBC\u307F \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function Import-EnvFile {
    param([string]$Path)
    if (-not (Test-Path -LiteralPath $Path)) { return $false }
    try { $lines = Get-Content -LiteralPath $Path -Encoding UTF8 -ErrorAction Stop }
    catch { Write-Warning ".env \u3092\u8AAD\u3081\u307E\u305B\u3093\u3067\u3057\u305F: $Path"; return $false }
    foreach ($raw in $lines) {
        $line = $raw.Trim()
        if (-not $line -or $line.StartsWith('#')) { continue }
        $eq = $line.IndexOf('=')
        if ($eq -lt 1) { continue }
        $key = $line.Substring(0, $eq).Trim()
        $val = $line.Substring($eq + 1).Trim()
        if ($val -match '^"(.*)"$' -or $val -match "^'(.*)'$") { $val = $Matches[1] }
        # \u65E2\u306B OS \u74B0\u5883\u5909\u6570\u304C\u3042\u308C\u3070\u4E0A\u66F8\u304D\u3057\u306A\u3044 (\u5F15\u6570 > OS env > .env)
        if (-not [Environment]::GetEnvironmentVariable($key)) {
            [Environment]::SetEnvironmentVariable($key, $val)
        }
    }
    return $true
}
if (-not $EnvFile) { $EnvFile = Join-Path $PSScriptRoot 'mikke-relay.env' }

# \u2500\u2500\u2500 helpers \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function Add-CorsHeaders {
    param([System.Net.HttpListenerResponse]$Response)
    $Response.Headers.Add('Access-Control-Allow-Origin', '*')
    $Response.Headers.Add('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')
    $Response.Headers.Add('Access-Control-Allow-Headers', 'Content-Type, Accept, Authorization, X-Requested-With')
    $Response.Headers.Add('Access-Control-Allow-Private-Network', 'true')
    $Response.Headers.Add('Access-Control-Max-Age', '86400')
}

function Send-Json {
    param([System.Net.HttpListenerResponse]$Response, [int]$Status = 200, $Body)
    $json = $Body | ConvertTo-Json -Depth 12 -Compress
    $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
    $Response.StatusCode = $Status
    $Response.ContentType = 'application/json; charset=utf-8'
    Add-CorsHeaders -Response $Response
    $Response.OutputStream.Write($bytes, 0, $bytes.Length)
    $Response.OutputStream.Close()
}

function Send-Error {
    param([System.Net.HttpListenerResponse]$Response, [int]$Status, [string]$Code, [string]$Detail)
    Send-Json -Response $Response -Status $Status -Body @{ ok = $false; error = @{ code = $Code; detail = $Detail } }
}

# \u2500\u2500\u2500 CSV \u30D1\u30FC\u30B5 (RFC4180\u3001PowerShell 5.1 \u4E92\u63DB) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \u5F79\u5272\u5206\u62C5: \u4E2D\u7D99\u30B5\u30FC\u30D0\u306F\u300CCSV \u2192 \u884C\u914D\u5217(JSON)\u300D\u306E\u30D1\u30FC\u30B9\u306E\u307F\u62C5\u3046\u3002\u5DEE\u5206\u5224\u5B9A
#   (\u691C\u77E5\u30B9\u30C6\u30FC\u30BF\u30B9\u9077\u79FB / \u6761\u4EF6\u8A55\u4FA1 / \u500B\u5225\u6307\u5B9A) \u306F\u30D6\u30E9\u30A6\u30B6\u306E import.ts \u3067\u884C\u3046
#   (\u30ED\u30B8\u30C3\u30AF\u306E\u4E8C\u91CD\u5B9F\u88C5\u3092\u907F\u3051\u308B\u305F\u3081)\u3002100MB \u7D1A\u306E\u30E1\u30E2\u30EA\u8CA0\u8377\u3092\u30B5\u30FC\u30D0\u5074\u306B\u9003\u304C\u3059
#   \u306E\u304C\u76EE\u7684\u3002ConvertFrom-Csv \u3092\u4F7F\u308F\u305A\u624B\u66F8\u304D\u30D1\u30FC\u30B5\u306B\u3057\u3066\u3044\u308B\u306E\u306F\u3001\u30AF\u30A9\u30FC\u30C8\u5185
#   \u6539\u884C\u30FBBOM\u30FB\u533A\u5207\u308A\u63A8\u5B9A\u3092 import.ts (csv.ts) \u3068\u5B8C\u5168\u4E00\u81F4\u3055\u305B\u308B\u305F\u3081\u3002
function ConvertFrom-CsvText {
    param([string]$Text)
    if (-not $Text) { return @{ headers = @(); rows = @() } }
    # BOM \u9664\u53BB
    if ($Text.Length -gt 0 -and [int]$Text[0] -eq 0xFEFF) { $Text = $Text.Substring(1) }

    $records = New-Object System.Collections.ArrayList
    $record = New-Object System.Collections.ArrayList
    $field = New-Object System.Text.StringBuilder
    $inQuotes = $false
    $i = 0; $n = $Text.Length
    while ($i -lt $n) {
        $c = $Text[$i]
        if ($inQuotes) {
            if ($c -eq '"') {
                if (($i + 1) -lt $n -and $Text[$i + 1] -eq '"') { [void]$field.Append('"'); $i += 2; continue }
                $inQuotes = $false; $i++; continue
            }
            [void]$field.Append($c); $i++; continue
        }
        if ($c -eq '"') { $inQuotes = $true; $i++; continue }
        if ($c -eq ',') { [void]$record.Add($field.ToString()); [void]$field.Clear(); $i++; continue }
        if ($c -eq "\`r") {
            if (($i + 1) -lt $n -and $Text[$i + 1] -eq "\`n") { $i++ }
            [void]$record.Add($field.ToString()); [void]$field.Clear()
            [void]$records.Add($record.ToArray()); $record.Clear(); $i++; continue
        }
        if ($c -eq "\`n") {
            [void]$record.Add($field.ToString()); [void]$field.Clear()
            [void]$records.Add($record.ToArray()); $record.Clear(); $i++; continue
        }
        [void]$field.Append($c); $i++
    }
    if ($field.Length -gt 0 -or $record.Count -gt 0) {
        [void]$record.Add($field.ToString())
        [void]$records.Add($record.ToArray())
    }
    # \u7A7A\u30EC\u30B3\u30FC\u30C9 (\u672B\u5C3E\u6539\u884C\u7531\u6765) \u3092\u9664\u53BB
    $nonEmpty = @($records | Where-Object { -not ($_.Count -eq 1 -and $_[0] -eq '') })
    if ($nonEmpty.Count -eq 0) { return @{ headers = @(); rows = @() } }
    $headers = @($nonEmpty[0] | ForEach-Object { $_.Trim() })
    $rows = New-Object System.Collections.ArrayList
    for ($r = 1; $r -lt $nonEmpty.Count; $r++) {
        $cols = $nonEmpty[$r]
        $obj = [ordered]@{}
        for ($h = 0; $h -lt $headers.Count; $h++) {
            $val = if ($h -lt $cols.Count) { [string]$cols[$h] } else { '' }
            $obj[$headers[$h]] = $val.Trim()
        }
        [void]$rows.Add($obj)
    }
    return @{ headers = $headers; rows = $rows }
}

# multipart/form-data \u304B\u3089\u6700\u521D\u306E\u30D5\u30A1\u30A4\u30EB\u30D1\u30FC\u30C8\u306E\u751F\u30D0\u30A4\u30C8\u3092\u53D6\u308A\u51FA\u3059\u3002
function Get-MultipartFileBytes {
    param([byte[]]$Body, [string]$Boundary)
    $enc = [System.Text.Encoding]::ASCII
    $delim = $enc.GetBytes("--$Boundary")
    # \u30D8\u30C3\u30C0\u7D42\u7AEF (CRLFCRLF) \u3092\u63A2\u3059\u7C21\u6613\u5B9F\u88C5
    $crlf2 = [byte[]](13, 10, 13, 10)
    # \u6700\u521D\u306E boundary \u5F8C\u306E\u30D1\u30FC\u30C8\u958B\u59CB\u4F4D\u7F6E
    $idx = (Find-Bytes -Haystack $Body -Needle $delim -Start 0)
    if ($idx -lt 0) { return $null }
    $headEnd = (Find-Bytes -Haystack $Body -Needle $crlf2 -Start $idx)
    if ($headEnd -lt 0) { return $null }
    $contentStart = $headEnd + 4
    # \u6B21\u306E boundary \u76F4\u524D (CRLF + --boundary) \u307E\u3067\u304C\u672C\u4F53
    $nextDelim = [byte[]]((13, 10) + $delim)
    $contentEnd = (Find-Bytes -Haystack $Body -Needle $nextDelim -Start $contentStart)
    if ($contentEnd -lt 0) { $contentEnd = $Body.Length }
    $len = $contentEnd - $contentStart
    if ($len -le 0) { return $null }
    $out = New-Object byte[] $len
    [Array]::Copy($Body, $contentStart, $out, 0, $len)
    return $out
}

function Find-Bytes {
    param([byte[]]$Haystack, [byte[]]$Needle, [int]$Start = 0)
    $hl = $Haystack.Length; $nl = $Needle.Length
    if ($nl -eq 0 -or $hl -lt $nl) { return -1 }
    for ($i = $Start; $i -le ($hl - $nl); $i++) {
        $match = $true
        for ($j = 0; $j -lt $nl; $j++) { if ($Haystack[$i + $j] -ne $Needle[$j]) { $match = $false; break } }
        if ($match) { return $i }
    }
    return -1
}

# \u30D0\u30A4\u30C8\u5217\u306E\u6587\u5B57\u30B3\u30FC\u30C9\u3092\u63A8\u5B9A\u3057\u3066\u30C7\u30B3\u30FC\u30C9 (UTF-8 BOM / UTF-8 / CP932)\u3002
function ConvertTo-DecodedText {
    param([byte[]]$Bytes)
    if ($null -eq $Bytes -or $Bytes.Length -eq 0) { return '' }
    # UTF-8 BOM
    if ($Bytes.Length -ge 3 -and $Bytes[0] -eq 0xEF -and $Bytes[1] -eq 0xBB -and $Bytes[2] -eq 0xBF) {
        return [System.Text.Encoding]::UTF8.GetString($Bytes, 3, $Bytes.Length - 3)
    }
    # UTF-8 \u3068\u3057\u3066\u53B3\u5BC6\u30C7\u30B3\u30FC\u30C9\u3092\u8A66\u307F\u3001\u5931\u6557\u3057\u305F\u3089 CP932 \u306B\u30D5\u30A9\u30FC\u30EB\u30D0\u30C3\u30AF
    try {
        $strict = New-Object System.Text.UTF8Encoding($false, $true)
        return $strict.GetString($Bytes)
    } catch {
        try {
            $cp932 = [System.Text.Encoding]::GetEncoding(932)
            return $cp932.GetString($Bytes)
        } catch {
            return [System.Text.Encoding]::UTF8.GetString($Bytes)
        }
    }
}

# \u2500\u2500\u2500 /mikke/csv-parse \u2014 \u5927\u5BB9\u91CF CSV \u89E3\u6790 (\u4E3B\u7D4C\u8DEF) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \u5165\u529B: multipart/form-data (file=CSV)\u3002
# \u51FA\u529B: { ok, headers, rows, rowCount }\u3002\u5DEE\u5206\u5224\u5B9A\u306F\u30D6\u30E9\u30A6\u30B6\u5074 import.ts \u304C\u884C\u3046\u3002
function Invoke-CsvParse {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $ctype = $request.ContentType
    if (-not $ctype -or $ctype -notmatch 'multipart/form-data') {
        Send-Error $response 400 'bad_content_type' 'multipart/form-data \u304C\u5FC5\u8981\u3067\u3059'
        return
    }
    $m = [regex]::Match($ctype, 'boundary=(?:"([^"]+)"|([^;]+))')
    if (-not $m.Success) { Send-Error $response 400 'no_boundary' 'boundary \u304C\u3042\u308A\u307E\u305B\u3093'; return }
    $boundary = if ($m.Groups[1].Value) { $m.Groups[1].Value } else { $m.Groups[2].Value.Trim() }

    # \u751F\u30D0\u30A4\u30C8\u3092\u8AAD\u3080 (\u30C6\u30AD\u30B9\u30C8\u5316\u524D\u306B file \u30D1\u30FC\u30C8\u3092\u62BD\u51FA\u3059\u308B\u5FC5\u8981\u304C\u3042\u308B\u305F\u3081)
    $ms = New-Object System.IO.MemoryStream
    $request.InputStream.CopyTo($ms)
    $body = $ms.ToArray()
    $ms.Dispose()

    $fileBytes = Get-MultipartFileBytes -Body $body -Boundary $boundary
    if ($null -eq $fileBytes) { Send-Error $response 400 'no_file' '\u30D5\u30A1\u30A4\u30EB\u30D1\u30FC\u30C8\u304C\u898B\u3064\u304B\u308A\u307E\u305B\u3093'; return }

    $text = ConvertTo-DecodedText -Bytes $fileBytes
    $parsed = ConvertFrom-CsvText -Text $text

    if ($parsed.headers.Count -eq 0) {
        Send-Error $response 400 'empty_csv' '\u7A7A\u306E CSV \u3067\u3059'
        return
    }

    Write-Host ("[csv-parse] {0} rows / {1} cols \u89E3\u6790\u5B8C\u4E86" -f $parsed.rows.Count, $parsed.headers.Count) -ForegroundColor Green

    Send-Json -Response $response -Status 200 -Body @{
        ok = $true
        headers = $parsed.headers
        rows = $parsed.rows
        rowCount = $parsed.rows.Count
        relayVersion = $MIKKE_RELAY_VERSION
    }
}

# \u2500\u2500\u2500 /mikke/bundle-dir \u2014 \u914D\u4FE1\u30C7\u30A3\u30EC\u30AF\u30C8\u30EA\u306E\u7167\u4F1A(GET)/\u5909\u66F4(POST) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# UI(\u8A2D\u5B9A\u2192\u958B\u767A\u8005) \u304B\u3089\u3001relay \u304C mikke.bundle.js / version.txt \u3092\u8AAD\u3080\u30D5\u30A9\u30EB\u30C0\u3092
# \u6307\u5B9A\u3067\u304D\u308B\u3088\u3046\u306B\u3059\u308B\u3002\u958B\u767A\u4E2D\u306B\u30D3\u30EB\u30C9\u5148(dist \u7B49)\u3092\u5DEE\u3057\u66FF\u3048\u3066\u5373\u53CD\u6620\u3059\u308B\u7528\u9014\u3002
function Invoke-BundleDir {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    if ($request.HttpMethod -eq 'POST') {
        $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
        $bodyText = $reader.ReadToEnd(); $reader.Close()
        $payload = $null
        try { if ($bodyText) { $payload = $bodyText | ConvertFrom-Json } }
        catch { Send-Error $response 400 'bad_json' $_.Exception.Message; return }
        $dir = if ($payload) { [string]$payload.dir } else { '' }
        $dir = $dir.Trim()
        if (-not $dir) { Send-Error $response 400 'no_dir' 'dir \u3092\u6307\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044'; return }
        if (-not (Test-Path -LiteralPath $dir -PathType Container)) {
            Send-Error $response 400 'not_found' "\u30C7\u30A3\u30EC\u30AF\u30C8\u30EA\u304C\u5B58\u5728\u3057\u307E\u305B\u3093: $dir"
            return
        }
        $script:BundleDir = (Resolve-Path -LiteralPath $dir).Path
        Write-Host "[bundle-dir] -> $script:BundleDir" -ForegroundColor Green
    }

    $bundlePath = Join-Path $script:BundleDir 'mikke.bundle.js'
    Send-Json -Response $response -Status 200 -Body @{
        ok = $true
        dir = $script:BundleDir
        bundleExists = (Test-Path -LiteralPath $bundlePath -PathType Leaf)
    }
}

# \u2500\u2500\u2500 /mikke/issue \u2014 \u691C\u67FB\u30C4\u30FC\u30EB API \u4E2D\u7D99 (\u30A2\u30C0\u30D7\u30BF\u59D4\u8B72) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \u5165\u529B: { issueInstanceId }\u3002\u51FA\u529B: \u6B63\u898F\u5316\u6E08\u307F Issue\u3002
#
# \u2605 API \u4ED5\u69D8\u306F\u59D4\u8A17\u5148\u74B0\u5883\u3067\u306E\u307F\u78BA\u8A8D\u3067\u304D\u308B\u305F\u3081\u3001\u5B9F\u88C5\u306F\u5225\u30D5\u30A1\u30A4\u30EB
#   mikke-scanner-adapter.ps1 \u306B\u59D4\u8B72\u3059\u308B (\u3053\u306E\u30D5\u30A1\u30A4\u30EB\u3068\u540C\u3058\u30D5\u30A9\u30EB\u30C0\u306B\u7F6E\u304F)\u3002
#   - \u30A2\u30C0\u30D7\u30BF\u306F self-update \u306E\u7BA1\u7406\u5916 (MIKKE_RELAY_MANAGED_FILES \u306B\u542B\u3081\u306A\u3044) &
#     git \u7BA1\u7406\u5916\u3002\u59D4\u8A17\u5148\u74B0\u5883\u3067\u81EA\u7531\u306B\u4F5C\u6210\u30FB\u66F4\u65B0\u3057\u3066\u3088\u3044\u3002relay \u672C\u4F53\u306F\u89E6\u3089\u306A\u3044\u3002
#   - \u5951\u7D04: Invoke-MikkeScannerFetch -IssueInstanceId <string> \u3092\u5B9A\u7FA9\u3057\u3001
#     @{ scannerStatus=<string>; severity=<string>; lastSeen=<ISO8601>;
#        scanFields=@{ '<\u5217\u540D>'='<\u5024>' } } \u3092\u8FD4\u3059 (scanFields \u306F\u4EFB\u610F)\u3002
#   - \u96DB\u5F62: mikke-scanner-adapter.example.ps1 \u3092\u30B3\u30D4\u30FC\u3057\u3066\u5B9F\u88C5\u3059\u308B\u3002
function Invoke-IssueFetch {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
    $bodyText = $reader.ReadToEnd(); $reader.Close()
    $iid = $null
    try { if ($bodyText) { $iid = ([string](($bodyText | ConvertFrom-Json).issueInstanceId)).Trim() } } catch { }
    if (-not $iid) { Send-Error $response 400 'no_issue_id' 'issueInstanceId \u3092\u6307\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044'; return }

    $adapterPath = Join-Path $PSScriptRoot 'mikke-scanner-adapter.ps1'
    if (-not (Test-Path -LiteralPath $adapterPath)) {
        Send-Json -Response $response -Status 501 -Body @{
            ok = $false
            error = @{ code = 'adapter_not_installed'
                       detail = 'mikke-scanner-adapter.ps1 \u304C\u672A\u914D\u7F6E\u3067\u3059\u3002mikke-scanner-adapter.example.ps1 \u3092\u30B3\u30D4\u30FC\u3057\u3066\u59D4\u8A17\u5148\u74B0\u5883\u3067\u5B9F\u88C5\u3057\u3001relay \u3068\u540C\u3058\u30D5\u30A9\u30EB\u30C0\u306B\u7F6E\u3044\u3066\u304F\u3060\u3055\u3044\u3002' }
        }
        return
    }
    try {
        # \u6BCE\u30EA\u30AF\u30A8\u30B9\u30C8 dot-source \u3059\u308B (\u958B\u767A\u4E2D\u306E\u5DEE\u3057\u66FF\u3048\u3092 relay \u518D\u8D77\u52D5\u306A\u3057\u3067\u53CD\u6620)\u3002
        # F3 \u306F\u5358\u767A API \u7528\u9014\u306A\u306E\u3067\u8AAD\u307F\u8FBC\u307F\u30B3\u30B9\u30C8\u306F\u8EFD\u5FAE\u3002
        . $adapterPath
        if (-not (Get-Command Invoke-MikkeScannerFetch -ErrorAction SilentlyContinue)) {
            Send-Error $response 500 'adapter_invalid' '\u30A2\u30C0\u30D7\u30BF\u306B Invoke-MikkeScannerFetch \u95A2\u6570\u304C\u5B9A\u7FA9\u3055\u308C\u3066\u3044\u307E\u305B\u3093'
            return
        }
        $result = Invoke-MikkeScannerFetch -IssueInstanceId $iid
        Write-Host "[issue] $iid -> OK" -ForegroundColor Green
        $scanFields = @{}
        if ($result.scanFields) { $scanFields = $result.scanFields }
        $body = @{
            ok = $true
            scannerStatus = [string]$result.scannerStatus
            severity = [string]$result.severity
            lastSeen = [string]$result.lastSeen
            scanFields = $scanFields
        }
        # detected (\u73FE\u5728\u3082\u691C\u51FA\u3055\u308C\u3066\u3044\u308B\u304B): \u30A2\u30C0\u30D7\u30BF\u304C\u8FD4\u3057\u305F\u5834\u5408\u306E\u307F\u542B\u3081\u308B\u3002
        # UI \u5074\u306F\u3053\u308C\u304C true/false \u306E\u6642\u3060\u3051\u691C\u77E5\u30B9\u30C6\u30FC\u30BF\u30B9\u3092\u9077\u79FB\u3055\u305B\u308B (\u7701\u7565=\u5909\u66F4\u306A\u3057)\u3002
        if ($null -ne $result.detected) { $body.detected = [bool]$result.detected }
        Send-Json -Response $response -Status 200 -Body $body
    } catch {
        # \u539F\u56E0\u7279\u5B9A\u306E\u305F\u3081\u3001\u4F8B\u5916\u306E\u8A73\u7D30 (\u578B / \u767A\u751F\u7B87\u6240 / HTTP \u60C5\u5831 / \u5FDC\u7B54\u30DC\u30C7\u30A3) \u3092\u51FA\u3059\u3002
        # \u203B \u30A2\u30C0\u30D7\u30BF\u304C\u5143\u306E WebException \u3092\u63E1\u308A\u3064\u3076\u3057\u3066\u6587\u5B57\u5217 throw \u3057\u305F\u5834\u5408\u3001HTTP
        #   \u8A73\u7D30\u306F\u3053\u3053\u3067\u306F\u53D6\u308C\u306A\u3044 (\u30A2\u30C0\u30D7\u30BF\u5074\u306E\u8A3A\u65AD\u30ED\u30B0\u898F\u7D04 = SPEC \xA75-1 \u3092\u53C2\u7167)\u3002
        Write-Host "[issue] $iid -> ERROR: $($_.Exception.Message)" -ForegroundColor Red
        Write-Host "  type : $($_.Exception.GetType().FullName)" -ForegroundColor DarkGray
        if ($_.InvocationInfo -and $_.InvocationInfo.ScriptName) {
            Write-Host ("  at   : {0}:{1}" -f (Split-Path -Leaf $_.InvocationInfo.ScriptName), $_.InvocationInfo.ScriptLineNumber) -ForegroundColor DarkGray
        }
        if ($_.ScriptStackTrace) {
            Write-Host "  stack: $($_.ScriptStackTrace -replace "\`r?\`n", ' <- ')" -ForegroundColor DarkGray
        }
        if ($_.Exception.Response) {
            try { Write-Host ("  http : {0}" -f [int]$_.Exception.Response.StatusCode) -ForegroundColor DarkGray } catch { }
        }
        if ($_.ErrorDetails -and $_.ErrorDetails.Message) {
            $snip = $_.ErrorDetails.Message
            if ($snip.Length -gt 500) { $snip = $snip.Substring(0, 500) + '\u2026' }
            Write-Host "  body : $snip" -ForegroundColor DarkGray
        }
        Send-Error $response 502 'adapter_error' $_.Exception.Message
    }
}

# \u2500\u2500\u2500 /mikke/issue-report \u2014 \u8106\u5F31\u6027 1 \u4EF6\u5206\u306E\u30EC\u30DD\u30FC\u30C8\u53D6\u5F97 (\u30A2\u30C0\u30D7\u30BF\u59D4\u8B72) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \u5165\u529B: { issueInstanceId }
# \u51FA\u529B: { ok:true, fileName, contentBase64, scannerDownloadTime }
#
# \u2605 \u5951\u7D04: Invoke-MikkeScannerIssueReport -IssueInstanceId <string> \u3092\u5B9A\u7FA9\u3057\u3001
#   @{ fileName='<\u691C\u67FB\u30C4\u30FC\u30EB\u304C\u4ED8\u3051\u305F\u540D\u524D.pdf>'; contentBase64='<Base64>';
#      scannerDownloadTime='<ISO8601>' } \u3092\u8FD4\u3059 (scannerDownloadTime \u306F\u4EFB\u610F)\u3002
# \u2605 \u672A\u5B9F\u88C5 (\u95A2\u6570\u304C\u7121\u3044) \u306F 501 \u3067\u8FD4\u3059\u3002\u30D6\u30E9\u30A6\u30B6\u5074\u306F\u30EC\u30DD\u30FC\u30C8\u3060\u3051\u8AE6\u3081\u3066\u60C5\u5831\u66F4\u65B0\u3092\u7D9A\u3051\u308B\u3002
function Invoke-IssueReport {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
    $bodyText = $reader.ReadToEnd(); $reader.Close()
    $iid = $null
    try { if ($bodyText) { $iid = ([string](($bodyText | ConvertFrom-Json).issueInstanceId)).Trim() } } catch { }
    if (-not $iid) { Send-Error $response 400 'no_issue_id' 'issueInstanceId \u3092\u6307\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044'; return }

    $adapterPath = Join-Path $PSScriptRoot 'mikke-scanner-adapter.ps1'
    if (-not (Test-Path -LiteralPath $adapterPath)) {
        Send-Json -Response $response -Status 501 -Body @{
            ok = $false
            error = @{ code = 'adapter_not_installed'
                       detail = 'mikke-scanner-adapter.ps1 \u304C\u672A\u914D\u7F6E\u3067\u3059\u3002mikke-scanner-adapter.example.ps1 \u3092\u30B3\u30D4\u30FC\u3057\u3066\u59D4\u8A17\u5148\u74B0\u5883\u3067\u5B9F\u88C5\u3057\u3001relay \u3068\u540C\u3058\u30D5\u30A9\u30EB\u30C0\u306B\u7F6E\u3044\u3066\u304F\u3060\u3055\u3044\u3002' }
        }
        return
    }
    try {
        . $adapterPath
        if (-not (Get-Command Invoke-MikkeScannerIssueReport -ErrorAction SilentlyContinue)) {
            # \u672A\u5B9F\u88C5\u306F\u300C\u30A8\u30E9\u30FC\u300D\u3067\u306F\u306A\u304F\u300C\u3053\u306E\u6A5F\u80FD\u306F\u7121\u3044\u300D\u3002501 \u306B\u3057\u3066 UI \u5074\u3067\u30B9\u30AD\u30C3\u30D7\u3055\u305B\u308B\u3002
            Send-Json -Response $response -Status 501 -Body @{
                ok = $false
                error = @{ code = 'adapter_not_implemented'
                           detail = '\u30A2\u30C0\u30D7\u30BF\u306B Invoke-MikkeScannerIssueReport \u95A2\u6570\u304C\u5B9A\u7FA9\u3055\u308C\u3066\u3044\u307E\u305B\u3093\uFF08\u500B\u5225\u30EC\u30DD\u30FC\u30C8\u53D6\u5F97\u306F\u672A\u5B9F\u88C5\uFF09' }
            }
            return
        }
        $result = Invoke-MikkeScannerIssueReport -IssueInstanceId $iid
        $fileName = [string]$result.fileName
        $content  = [string]$result.contentBase64
        if (-not $content) { throw '\u30A2\u30C0\u30D7\u30BF\u304C contentBase64 \u3092\u8FD4\u3057\u307E\u305B\u3093\u3067\u3057\u305F' }
        if (-not $fileName) { $fileName = "$iid.pdf" }
        Write-Host "[issue-report] $iid -> $fileName ($([math]::Round($content.Length / 1KB)) KB base64)" -ForegroundColor Green
        $body = @{ ok = $true; fileName = $fileName; contentBase64 = $content }
        if ($result.scannerDownloadTime) { $body.scannerDownloadTime = [string]$result.scannerDownloadTime }
        Send-Json -Response $response -Status 200 -Body $body
    } catch {
        Write-Host "[issue-report] $iid -> ERROR: $($_.Exception.Message)" -ForegroundColor Red
        if ($_.InvocationInfo -and $_.InvocationInfo.ScriptName) {
            Write-Host ("  at   : {0}:{1}" -f (Split-Path -Leaf $_.InvocationInfo.ScriptName), $_.InvocationInfo.ScriptLineNumber) -ForegroundColor DarkGray
        }
        Send-Error $response 502 'adapter_error' $_.Exception.Message
    }
}

# \u2500\u2500\u2500 /mikke/issues \u2014 \u8907\u6570\u8106\u5F31\u6027\u306E\u60C5\u5831\uFF0B\u30EC\u30DD\u30FC\u30C8\u3092\u4E26\u5217\u53D6\u5F97 (\u30A2\u30C0\u30D7\u30BF\u59D4\u8B72) \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \u5165\u529B: { issueInstanceIds: ["IID-1","IID-2"], includeReport: true }
# \u51FA\u529B: { ok:true, items:[ { issueInstanceId, ok, scannerStatus, severity, lastSeen,
#                            detected, scanFields, report:{fileName,contentBase64,...},
#                            reportError, error } ] }
#
# \u2605 \u306A\u305C\u3053\u306E\u30A8\u30F3\u30C9\u30DD\u30A4\u30F3\u30C8\u304C\u8981\u308B\u304B:
#   relay \u306E request loop \u306F GetContext() \u306E\u9010\u6B21\u30EB\u30FC\u30D7\u3067\u30011 \u30EA\u30AF\u30A8\u30B9\u30C8\u305A\u3064\u3057\u304B\u51E6\u7406\u3057\u306A\u3044\u3002
#   \u305D\u306E\u305F\u3081\u30D6\u30E9\u30A6\u30B6\u5074\u304B\u3089 /mikke/issue \u3092\u4E26\u5217\u306B\u53E9\u3044\u3066\u3082 listener \u3067\u5F85\u305F\u3055\u308C\u3001\u5B9F\u8CEA\u76F4\u5217\u306B\u306A\u308B\u3002
#   /mikke/download \u3068\u540C\u3058 runspace \u30D7\u30FC\u30EB\u65B9\u5F0F\u3067 **relay \u5185\u3067\u4E26\u5217\u5316**\u3059\u308B\u3002
# \u2605 1 \u8106\u5F31\u6027 = 1 runspace\u3002\u5404 runspace \u304C adapter \u3092 dot-source \u3057
#   Invoke-MikkeScannerFetch (+ \u4EFB\u610F\u3067 Invoke-MikkeScannerIssueReport) \u3092\u547C\u3076\u3002
#   1 \u4EF6\u306E\u5931\u6557\u306F\u4ED6\u3092\u5DFB\u304D\u8FBC\u307E\u306A\u3044 (items[].ok=false \u3067\u500B\u5225\u306B\u8FD4\u3059)\u3002
$MIKKE_ISSUES_MAX_PARALLEL = 5

function Invoke-IssuesBatch {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
    $bodyText = $reader.ReadToEnd(); $reader.Close()
    $ids = @()
    $includeReport = $false
    try {
        if ($bodyText) {
            $parsed = $bodyText | ConvertFrom-Json
            if ($parsed.issueInstanceIds) { $ids = @($parsed.issueInstanceIds | ForEach-Object { ([string]$_).Trim() } | Where-Object { $_ }) }
            if ($null -ne $parsed.includeReport) { $includeReport = [bool]$parsed.includeReport }
        }
    } catch { }
    if (-not $ids -or $ids.Count -eq 0) { Send-Error $response 400 'no_issue_id' 'issueInstanceIds \u3092 1 \u3064\u4EE5\u4E0A\u6307\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044'; return }

    $adapterPath = Join-Path $PSScriptRoot 'mikke-scanner-adapter.ps1'
    if (-not (Test-Path -LiteralPath $adapterPath)) {
        Send-Json -Response $response -Status 501 -Body @{
            ok = $false
            error = @{ code = 'adapter_not_installed'
                       detail = 'mikke-scanner-adapter.ps1 \u304C\u672A\u914D\u7F6E\u3067\u3059\u3002mikke-scanner-adapter.example.ps1 \u3092\u30B3\u30D4\u30FC\u3057\u3066\u59D4\u8A17\u5148\u74B0\u5883\u3067\u5B9F\u88C5\u3057\u3001relay \u3068\u540C\u3058\u30D5\u30A9\u30EB\u30C0\u306B\u7F6E\u3044\u3066\u304F\u3060\u3055\u3044\u3002' }
        }
        return
    }

    # 1 \u8106\u5F31\u6027\u3076\u3093\u3092\u53D6\u5F97\u3059\u308B worker (\u9694\u96E2 runspace \u5185\u3067\u5B9F\u884C\u3055\u308C\u308B)\u3002
    # \u30EC\u30DD\u30FC\u30C8\u306F\u300C\u4EFB\u610F\u5B9F\u88C5\u300D\u306A\u306E\u3067\u3001\u95A2\u6570\u304C\u7121\u3051\u308C\u3070 reportSkipped \u3092\u7ACB\u3066\u308B\u3060\u3051\u3067 throw \u3057\u306A\u3044\u3002
    $worker = {
        param($AdapterPath, $Iid, $WithReport)
        . $AdapterPath
        if (-not (Get-Command Invoke-MikkeScannerFetch -ErrorAction SilentlyContinue)) {
            throw '\u30A2\u30C0\u30D7\u30BF\u306B Invoke-MikkeScannerFetch \u95A2\u6570\u304C\u5B9A\u7FA9\u3055\u308C\u3066\u3044\u307E\u305B\u3093'
        }
        $fetched = Invoke-MikkeScannerFetch -IssueInstanceId $Iid
        $out = @{
            issueInstanceId = $Iid
            scannerStatus   = [string]$fetched.scannerStatus
            severity        = [string]$fetched.severity
            lastSeen        = [string]$fetched.lastSeen
            scanFields      = $(if ($fetched.scanFields) { $fetched.scanFields } else { @{} })
        }
        if ($null -ne $fetched.detected) { $out.detected = [bool]$fetched.detected }

        if ($WithReport) {
            if (-not (Get-Command Invoke-MikkeScannerIssueReport -ErrorAction SilentlyContinue)) {
                $out.reportSkipped = $true
            } else {
                # \u30EC\u30DD\u30FC\u30C8\u3060\u3051\u306E\u5931\u6557\u3067\u60C5\u5831\u66F4\u65B0\u307E\u3067\u843D\u3068\u3055\u306A\u3044\u3002
                try {
                    $rep = Invoke-MikkeScannerIssueReport -IssueInstanceId $Iid
                    if ($rep -and $rep.contentBase64) {
                        $name = [string]$rep.fileName
                        if (-not $name) { $name = "$Iid.pdf" }
                        $out.report = @{
                            fileName            = $name
                            contentBase64       = [string]$rep.contentBase64
                            scannerDownloadTime = [string]$rep.scannerDownloadTime
                        }
                    } else {
                        $out.reportError = '\u30A2\u30C0\u30D7\u30BF\u304C contentBase64 \u3092\u8FD4\u3057\u307E\u305B\u3093\u3067\u3057\u305F'
                    }
                } catch {
                    $out.reportError = $_.Exception.Message
                }
            }
        }
        return $out
    }

    $cap = [Math]::Min($ids.Count, $MIKKE_ISSUES_MAX_PARALLEL)
    $pool = [RunspaceFactory]::CreateRunspacePool(1, $cap)
    $pool.Open()
    $jobs = @()
    foreach ($id in $ids) {
        $ps = [PowerShell]::Create()
        $ps.RunspacePool = $pool
        [void]$ps.AddScript($worker).AddArgument($adapterPath).AddArgument($id).AddArgument($includeReport)
        $jobs += [pscustomobject]@{ Iid = $id; PS = $ps; Handle = $ps.BeginInvoke() }
    }

    $items = @()
    $okCount = 0
    $ngCount = 0
    foreach ($j in $jobs) {
        try {
            $out = $j.PS.EndInvoke($j.Handle)
            foreach ($info in $j.PS.Streams.Information) {
                Write-Host ("[issues:{0}] {1}" -f $j.Iid, $info.ToString()) -ForegroundColor DarkGray
            }
            # EndInvoke \u306F\u7D50\u679C\u3092\u30B3\u30EC\u30AF\u30B7\u30E7\u30F3\u3067\u8FD4\u3059\u306E\u3067 1 \u4EF6\u76EE\u3092\u53D6\u308A\u51FA\u3059\u3002
            $one = $null
            if ($out) { foreach ($o in $out) { $one = $o; break } }
            if (-not $one) { throw '\u30A2\u30C0\u30D7\u30BF\u304C\u7D50\u679C\u3092\u8FD4\u3057\u307E\u305B\u3093\u3067\u3057\u305F' }
            $one.ok = $true
            $items += $one
            $okCount++
        } catch {
            $items += @{ issueInstanceId = $j.Iid; ok = $false; error = $_.Exception.Message }
            $ngCount++
            Write-Host ("[issues:{0}] ERROR: {1}" -f $j.Iid, $_.Exception.Message) -ForegroundColor Red
        } finally {
            $j.PS.Dispose()
        }
    }
    $pool.Close(); $pool.Dispose()

    Write-Host ("[issues] {0} \u4EF6 (\u4E26\u5217 {1}) -> OK {2} / NG {3}" -f $ids.Count, $cap, $okCount, $ngCount) -ForegroundColor Green
    # \u5168\u6EC5\u6642\u306E\u307F\u30A8\u30E9\u30FC\u5FDC\u7B54\u3002\u4E00\u90E8\u3067\u3082\u53D6\u308C\u3066\u3044\u308C\u3070 200 \u3067\u8FD4\u3059 (\u90E8\u5206\u6210\u529F)\u3002
    if ($okCount -eq 0) {
        $first = ''
        foreach ($it in $items) { if ($it.error) { $first = [string]$it.error; break } }
        Send-Error $response 502 'adapter_error' $first
        return
    }
    Send-Json -Response $response -Status 200 -Body @{ ok = $true; items = $items }
}

# \u2500\u2500\u2500 /mikke/download \u2014 \u8106\u5F31\u6027/\u8CC7\u7523\u30C7\u30FC\u30BF\u306E\u4E00\u62EC\u30C0\u30A6\u30F3\u30ED\u30FC\u30C9\u4E2D\u7D99 (\u30A2\u30C0\u30D7\u30BF\u59D4\u8B72) \u2500\u2500
# \u5165\u529B: { types: ["vuln","ip","iprange","domain","cert","webapps"] }
# \u51FA\u529B: { ok:true, items:[ { type, fileName, contentBase64, scannerDownloadTime, itemCount } ] }
#
# \u2605 /mikke/issue \u3068\u540C\u3058\u304F\u30A2\u30C0\u30D7\u30BF (mikke-scanner-adapter.ps1) \u306B\u59D4\u8B72\u3059\u308B\u3002
#   \u5951\u7D04: Invoke-MikkeScannerDownload -Types <string[]> \u3092\u5B9A\u7FA9\u3057\u3001\u4E0A\u8A18 items \u3092\u8FD4\u3059\u3002
#   contentBase64 \u306F\u30D5\u30A1\u30A4\u30EB\u5185\u5BB9\u306E Base64 (CSV/xlsx \u7B49\u30D0\u30A4\u30CA\u30EA\u5B89\u5168)\u3002zip \u5316\u30FBSP \u4FDD\u5B58\u306F
#   \u30D6\u30E9\u30A6\u30B6\u5074 (SP \u8A8D\u8A3C\u3042\u308A) \u304C\u884C\u3046\u3002relay \u306F\u53D6\u5F97\u306E\u4E2D\u7D99\u306E\u307F\u3002
#
# \u2605 \u4E26\u5217\u30C0\u30A6\u30F3\u30ED\u30FC\u30C9: \u8981\u6C42\u3055\u308C\u305F\u7A2E\u5225\u3092 runspace \u30D7\u30FC\u30EB\u3067**\u7A2E\u5225\u3054\u3068\u306B\u4E26\u5217\u53D6\u5F97**\u3059\u308B\u3002
#   1 \u7A2E\u5225 = 1 runspace \u3067 adapter \u3092 dot-source \u3057 Invoke-MikkeScannerDownload -Types @(<\u7A2E\u5225>)
#   \u3092\u547C\u3076 (\u5404 runspace \u306F\u9694\u96E2\u3002\u5171\u6709\u72B6\u614B\u306A\u3057)\u3002\u5168\u4F53\u306E\u6240\u8981 \u2252 \u6700\u3082\u9045\u3044 1 \u7A2E\u5225 (\u76F4\u5217\u306E\u7DCF\u548C\u3067\u306F\u306A\u3044)\u3002
#   1 \u7A2E\u5225\u306E\u5931\u6557\u306F\u4ED6\u3092\u5DFB\u304D\u8FBC\u307E\u306A\u3044 (\u90E8\u5206\u6210\u529F\u3092\u8A31\u5BB9)\u3002\u5168\u6EC5\u6642\u306E\u307F 502\u3002
$MIKKE_DOWNLOAD_MAX_PARALLEL = 6

function Invoke-Download {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
    $bodyText = $reader.ReadToEnd(); $reader.Close()
    $types = @()
    try {
        if ($bodyText) {
            $parsed = ($bodyText | ConvertFrom-Json).types
            if ($parsed) { $types = @($parsed | ForEach-Object { [string]$_ }) }
        }
    } catch { }
    if (-not $types -or $types.Count -eq 0) { Send-Error $response 400 'no_types' 'types \u3092 1 \u3064\u4EE5\u4E0A\u6307\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044'; return }

    $adapterPath = Join-Path $PSScriptRoot 'mikke-scanner-adapter.ps1'
    if (-not (Test-Path -LiteralPath $adapterPath)) {
        Send-Json -Response $response -Status 501 -Body @{
            ok = $false
            error = @{ code = 'adapter_not_installed'
                       detail = 'mikke-scanner-adapter.ps1 \u304C\u672A\u914D\u7F6E\u3067\u3059\u3002mikke-scanner-adapter.example.ps1 \u3092\u30B3\u30D4\u30FC\u3057\u3066\u59D4\u8A17\u5148\u74B0\u5883\u3067\u5B9F\u88C5\u3057\u3001relay \u3068\u540C\u3058\u30D5\u30A9\u30EB\u30C0\u306B\u7F6E\u3044\u3066\u304F\u3060\u3055\u3044\u3002' }
        }
        return
    }

    # 1 \u7A2E\u5225\u3092\u53D6\u5F97\u3059\u308B worker (\u9694\u96E2 runspace \u5185\u3067\u5B9F\u884C\u3055\u308C\u308B)\u3002adapter \u3092 dot-source \u3057
    # 1 \u7A2E\u5225\u3076\u3093\u306E items \u3092\u8FD4\u3059\u3002\u8A3A\u65AD\u30ED\u30B0 (Write-Host) \u306F Information \u30B9\u30C8\u30EA\u30FC\u30E0\u306B\u6E9C\u307E\u308B\u3002
    $worker = {
        param($AdapterPath, $Type)
        . $AdapterPath
        if (-not (Get-Command Invoke-MikkeScannerDownload -ErrorAction SilentlyContinue)) {
            throw '\u30A2\u30C0\u30D7\u30BF\u306B Invoke-MikkeScannerDownload \u95A2\u6570\u304C\u5B9A\u7FA9\u3055\u308C\u3066\u3044\u307E\u305B\u3093'
        }
        $r = Invoke-MikkeScannerDownload -Types @($Type)
        if ($r -and $r.items) { return @($r.items) }
        return @()
    }

    $cap = [Math]::Min($types.Count, $MIKKE_DOWNLOAD_MAX_PARALLEL)
    $pool = [RunspaceFactory]::CreateRunspacePool(1, $cap)
    $pool.Open()
    $jobs = @()
    foreach ($t in $types) {
        $ps = [PowerShell]::Create()
        $ps.RunspacePool = $pool
        [void]$ps.AddScript($worker).AddArgument($adapterPath).AddArgument($t)
        $jobs += [pscustomobject]@{ Type = $t; PS = $ps; Handle = $ps.BeginInvoke() }
    }

    $items = @()
    $errors = @()
    foreach ($j in $jobs) {
        try {
            $out = $j.PS.EndInvoke($j.Handle)
            # adapter \u306E\u8A3A\u65AD\u30ED\u30B0 (Write-Host \u2192 Information) \u3092 relay \u30B3\u30F3\u30BD\u30FC\u30EB\u3078\u518D\u51FA\u529B\u3002
            foreach ($info in $j.PS.Streams.Information) {
                Write-Host ("[download:{0}] {1}" -f $j.Type, $info.ToString()) -ForegroundColor DarkGray
            }
            if ($out) {
                foreach ($it in $out) {
                    $items += @{
                        type                = [string]$it.type
                        fileName            = [string]$it.fileName
                        contentBase64       = [string]$it.contentBase64
                        scannerDownloadTime = [string]$it.scannerDownloadTime
                        itemCount           = [int]$it.itemCount
                    }
                }
            }
        } catch {
            # EndInvoke \u306F worker \u304C throw \u3059\u308B\u3068\u518D\u30B9\u30ED\u30FC\u3059\u308B\u30021 \u7A2E\u5225\u306E\u5931\u6557\u306F\u8A18\u9332\u3057\u3066\u7D99\u7D9A\u3002
            $errors += ("{0}: {1}" -f $j.Type, $_.Exception.Message)
            Write-Host ("[download:{0}] ERROR: {1}" -f $j.Type, $_.Exception.Message) -ForegroundColor Red
        } finally {
            $j.PS.Dispose()
        }
    }
    $pool.Close(); $pool.Dispose()

    $errNote = ''
    if ($errors.Count -gt 0) { $errNote = " / errors: $($errors.Count)" }
    Write-Host ("[download] {0} -> {1} file(s){2}" -f ($types -join ','), $items.Count, $errNote) -ForegroundColor Green

    # \u5168\u7A2E\u5225\u304C\u5931\u6557\u3057\u305F\u6642\u306E\u307F\u30A8\u30E9\u30FC\u5FDC\u7B54\u3002\u4E00\u90E8\u3067\u3082\u53D6\u5F97\u3067\u304D\u308C\u3070\u305D\u308C\u3092\u8FD4\u3059 (\u90E8\u5206\u6210\u529F)\u3002
    if ($items.Count -eq 0 -and $errors.Count -gt 0) {
        Send-Error $response 502 'adapter_error' ($errors -join ' | ')
        return
    }
    Send-Json -Response $response -Status 200 -Body @{ ok = $true; items = $items }
}

# \u2500\u2500\u2500 /mikke/merge \u2014 \u30C0\u30A6\u30F3\u30ED\u30FC\u30C9\u6E08\u307F\u30D5\u30A1\u30A4\u30EB\u304B\u3089\u53D6\u8FBC\u7528\u30DE\u30FC\u30B8 CSV \u3092\u751F\u6210 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# \u5165\u529B: { files: [ { type, fileName, contentBase64 } ] }  (/mikke/download \u306E\u7D50\u679C)
# \u51FA\u529B: { ok:true, fileName, contentBase64, rowCount }    (CSV 1 \u30D5\u30A1\u30A4\u30EB)
#
# \u2605 \u30A2\u30C0\u30D7\u30BF (mikke-scanner-adapter.ps1) \u306B\u59D4\u8B72\u3059\u308B\u3002
#   \u5951\u7D04: Invoke-MikkeScannerMerge -Files <object[]> \u3092\u5B9A\u7FA9\u3057\u3001
#         @{ fileName=<string>; contentBase64=<string>; rowCount=<int> } \u3092\u8FD4\u3059\u3002
#   \u751F\u6210\u3059\u308B CSV \u306F\u300C\u901A\u5E38\u306E CSV \u53D6\u8FBC\u30E1\u30CB\u30E5\u30FC\u3067\u53D6\u308A\u8FBC\u3080 CSV \u3068\u540C\u3058\u5217\u69CB\u6210\u300D\u306B\u3059\u308B\u3053\u3068
#   (Issue Instance ID / Title / Severity / Status / First Seen / Last Seen \uFF0B\u8CC7\u7523\u5217)\u3002
function Invoke-Merge {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
    $bodyText = $reader.ReadToEnd(); $reader.Close()
    $files = @()
    try {
        if ($bodyText) {
            $parsed = ($bodyText | ConvertFrom-Json).files
            if ($parsed) { $files = @($parsed) }
        }
    } catch { }
    if (-not $files -or $files.Count -eq 0) { Send-Error $response 400 'no_files' 'files \u3092 1 \u3064\u4EE5\u4E0A\u6307\u5B9A\u3057\u3066\u304F\u3060\u3055\u3044'; return }

    $adapterPath = Join-Path $PSScriptRoot 'mikke-scanner-adapter.ps1'
    if (-not (Test-Path -LiteralPath $adapterPath)) {
        Send-Json -Response $response -Status 501 -Body @{
            ok = $false
            error = @{ code = 'adapter_not_installed'
                       detail = 'mikke-scanner-adapter.ps1 \u304C\u672A\u914D\u7F6E\u3067\u3059\u3002mikke-scanner-adapter.example.ps1 \u3092\u30B3\u30D4\u30FC\u3057\u3066\u59D4\u8A17\u5148\u74B0\u5883\u3067\u5B9F\u88C5\u3057\u3001relay \u3068\u540C\u3058\u30D5\u30A9\u30EB\u30C0\u306B\u7F6E\u3044\u3066\u304F\u3060\u3055\u3044\u3002' }
        }
        return
    }
    try {
        . $adapterPath
        if (-not (Get-Command Invoke-MikkeScannerMerge -ErrorAction SilentlyContinue)) {
            Send-Error $response 500 'adapter_invalid' '\u30A2\u30C0\u30D7\u30BF\u306B Invoke-MikkeScannerMerge \u95A2\u6570\u304C\u5B9A\u7FA9\u3055\u308C\u3066\u3044\u307E\u305B\u3093'
            return
        }
        $result = Invoke-MikkeScannerMerge -Files $files
        if (-not $result -or -not $result.contentBase64) {
            Send-Error $response 502 'merge_empty' '\u30DE\u30FC\u30B8\u7D50\u679C\u304C\u7A7A\u3067\u3059 (contentBase64 \u304C\u8FD4\u3063\u3066\u3044\u307E\u305B\u3093)'
            return
        }
        $name = [string]$result.fileName
        if (-not $name) { $name = 'merged.csv' }
        $rowCount = 0
        if ($null -ne $result.rowCount) { $rowCount = [int]$result.rowCount }
        Write-Host ("[merge] {0} file(s) -> {1} ({2} rows)" -f $files.Count, $name, $rowCount) -ForegroundColor Green
        Send-Json -Response $response -Status 200 -Body @{
            ok = $true; fileName = $name; contentBase64 = [string]$result.contentBase64; rowCount = $rowCount
        }
    } catch {
        Write-Host "[merge] ERROR: $($_.Exception.Message)" -ForegroundColor Red
        if ($_.InvocationInfo -and $_.InvocationInfo.ScriptName) {
            Write-Host ("  at   : {0}:{1}" -f (Split-Path -Leaf $_.InvocationInfo.ScriptName), $_.InvocationInfo.ScriptLineNumber) -ForegroundColor DarkGray
        }
        if ($_.ScriptStackTrace) {
            Write-Host "  stack: $($_.ScriptStackTrace -replace "\`r?\`n", ' <- ')" -ForegroundColor DarkGray
        }
        Send-Error $response 502 'adapter_error' $_.Exception.Message
    }
}

# \u2500\u2500\u2500 /mikke/relay/self-update \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
function Invoke-RelaySelfUpdate {
    param([System.Net.HttpListenerContext]$Context)
    $request = $Context.Request
    $response = $Context.Response

    $reader = New-Object System.IO.StreamReader($request.InputStream, [System.Text.Encoding]::UTF8)
    $bodyText = $reader.ReadToEnd(); $reader.Close()
    $payload = $null
    try { if ($bodyText) { $payload = $bodyText | ConvertFrom-Json } }
    catch { Send-Error $response 400 'bad_json' $_.Exception.Message; return }
    if (-not $payload -or -not $payload.files) { Send-Error $response 400 'no_files' 'files \u914D\u5217\u304C\u5FC5\u8981\u3067\u3059'; return }

    $allowedNames = $script:MIKKE_RELAY_MANAGED_FILES | ForEach-Object { $_.ToLower() }
    $scriptDir = $PSScriptRoot
    $staged = @()
    foreach ($file in $payload.files) {
        $name = [string]$file.name
        $b64 = [string]$file.contentBase64
        if (-not $name -or -not $b64) { Send-Error $response 400 'invalid_file' "\u7A7A: $name"; return }
        if ($name.ToLower() -notin $allowedNames) { Send-Error $response 400 'not_allowed' "\u7BA1\u7406\u5BFE\u8C61\u5916: $name"; return }
        if ($name -match '[\\\\/:]') { Send-Error $response 400 'invalid_name' "\u30D1\u30B9\u533A\u5207\u308A: $name"; return }
        try { $bytes = [Convert]::FromBase64String($b64) }
        catch { Send-Error $response 400 'invalid_base64' "\u30C7\u30B3\u30FC\u30C9\u5931\u6557: $name"; return }
        if ($bytes.Length -lt 100) { Send-Error $response 400 'too_small' "$name \u304C\u5C0F\u3055\u3059\u304E\u308B"; return }
        if ($bytes.Length -gt 5MB) { Send-Error $response 400 'too_large' "$name \u304C\u5927\u304D\u3059\u304E\u308B"; return }
        if ($bytes[0] -lt 9) { Send-Error $response 400 'binary_detected' "$name \u304C\u30D0\u30A4\u30CA\u30EA\u3089\u3057\u3044"; return }
        $newPath = Join-Path $scriptDir ($name + '.new')
        try { [System.IO.File]::WriteAllBytes($newPath, $bytes); $staged += @{ name = $name; size = $bytes.Length } }
        catch { Send-Error $response 500 'write_failed' "$name \u66F8\u8FBC\u5931\u6557: $($_.Exception.Message)"; return }
    }
    Write-Host "[self-update] staged $($staged.Count) files" -ForegroundColor Cyan

    $updaterBat = Join-Path $scriptDir 'mikke-updater.bat'
    $managedListBat = ($script:MIKKE_RELAY_MANAGED_FILES -join ' ')
    # \u2605 .bat \u306F **ASCII \u306E\u307F**\u306B\u3059\u308B\u3053\u3068\u3002
    #   cmd.exe \u306F .bat \u3092\u30B7\u30B9\u30C6\u30E0 ANSI \u30B3\u30FC\u30C9\u30DA\u30FC\u30B8 (\u65E5\u672C\u8A9E Windows \u306A\u3089 CP932) \u3067
    #   \u89E3\u91C8\u3059\u308B\u3002UTF-8 \u3067\u65E5\u672C\u8A9E\u3092\u66F8\u304F\u3068\u5316\u3051\u305F\u30D0\u30A4\u30C8\u5217\u304C\u884C\u3092\u5206\u65AD\u3057\u3001\u30D0\u30C3\u30C1\u304C
    #   \u9014\u4E2D\u304B\u3089\u5225\u306E\u30B3\u30DE\u30F3\u30C9\u3068\u3057\u3066\u5B9F\u884C\u3055\u308C\u3066 **\u7F6E\u63DB\u3082\u518D\u8D77\u52D5\u3082\u8D77\u304D\u306A\u3044**
    #   (relay \u306F\u65E2\u306B\u7D42\u4E86\u3057\u3066\u3044\u308B\u306E\u3067\u4E2D\u7D99\u30B5\u30FC\u30D0\u304C\u843D\u3061\u305F\u307E\u307E\u306B\u306A\u308B)\u3002
    #   \u540C\u68B1\u306E mikke-relay.bat / mikke-launch.bat \u3068\u540C\u3058\u898F\u7D04\u3002
    # \u2605 \u5C45\u6B8B\u308A relay \u306E\u6383\u9664\u306F\u300C\u30DD\u30FC\u30C8\u306E\u6240\u6709\u8005\u300D\u3067\u306F\u306A\u304F **\u81EA\u5206\u306E\u30B9\u30AF\u30EA\u30D7\u30C8\u3092\u5B9F\u884C\u4E2D\u306E
    #   powershell.exe** \u3092\u72D9\u3046\u3002PowerShell \u306E HttpListener \u306F http.sys (\u30AB\u30FC\u30CD\u30EB) \u304C
    #   \u5F85\u53D7\u3092\u6301\u3064\u305F\u3081\u3001Get-NetTCPConnection \u306E OwningProcess \u306F **PID 4 (System)** \u306B
    #   \u306A\u308B (\u5B9F\u6A5F\u3067\u78BA\u8A8D)\u3002\u65E7\u5B9F\u88C5\u306F\u305D\u308C\u3092 Stop-Process -Force \u3057\u3088\u3046\u3068\u3057\u3066\u304A\u308A\u3001
    #   \u6383\u9664\u306B\u306A\u3089\u306A\u3044\u3046\u3048 System \u3092 kill \u3057\u306B\u3044\u3063\u3066\u3044\u305F\u3002
    #   \u5BFE\u8C61\u306F\u81EA\u30D5\u30A9\u30EB\u30C0\u306E\u30B9\u30AF\u30EA\u30D7\u30C8\u306B\u9650\u5B9A\u3059\u308B (\u5225\u30DD\u30FC\u30C8\u3067\u52D5\u304B\u3057\u3066\u3044\u308B relay \u3092\u5DFB\u304D\u8FBC\u307E\u306A\u3044)\u3002

    $batContent = @"
@echo off
REM mikke-updater.bat (generated by mikke-relay.ps1 self-update)
REM ASCII ONLY - cmd.exe parses .bat using the system ANSI code page (CP932 on JP
REM Windows), not UTF-8. Japanese here breaks line parsing and the update silently

setlocal

goto :wait

powershell -NoProfile -Command "& { try { Get-CimInstance Win32_Process | Where-Object { \`$_.Name -eq 'powershell.exe' -and \`$_.CommandLine -like '*%SCRIPT_DIR%mikke-relay.ps1*' } | ForEach-Object { Stop-Process -Id \`$_.ProcessId -Force -ErrorAction SilentlyContinue } } catch { } }" >nul 2>&1
echo [updater] replacing files...
for %%F in (%MANAGED%) do (
