            #   \u518D\u8AAD\u8FBC\u3057\u3066\u3082\u3001\u66F4\u65B0\u30DC\u30BF\u30F3\u3092\u62BC\u3057\u3066\u3082\u3001\u5E38\u306B\u6700\u65B0\u306E\u30ED\u30FC\u30AB\u30EB dist \u304C\u52D5\u304F\u3002
            #   \u30D0\u30F3\u30C9\u30EB\u3092\u76F4\u63A5\u6D41\u3057\u8FBC\u3080\u3068\u300C\u6CE8\u5165\u3057\u305F\u77AC\u9593\u306E\u4E2D\u8EAB\u300D\u3067\u56FA\u5B9A\u3055\u308C\u3066\u3057\u307E\u3044\u3001
            #   \u66F4\u65B0\u306E\u305F\u3073\u306B mikke-launch.bat \u3092\u5B9F\u884C\u3057\u76F4\u3059\u7FBD\u76EE\u306B\u306A\u308B\u3002
            #   MIKKE_INJECT=bundle \u3067\u5F93\u6765\u3069\u304A\u308A\u306E\u76F4\u63A5\u6CE8\u5165\u306B\u623B\u305B\u308B (relay \u4E0D\u8ABF\u6642\u306E\u9003\u3052\u9053)\u3002
            $injectMode = [Environment]::GetEnvironmentVariable('MIKKE_INJECT')
            $bundleFile = Join-Path $scriptDir 'mikke.bundle.js'
            $loaderFile = Join-Path $scriptDir 'mikke.loader.js'
            $useBundle = ($injectMode -eq 'bundle') -or (-not (Test-Path -LiteralPath $loaderFile))

            if ($useBundle) {
                if (-not (Test-Path -LiteralPath $bundleFile)) {
                    throw ("mikke.bundle.js \u3082 mikke.loader.js \u3082\u898B\u3064\u304B\u308A\u307E\u305B\u3093: $scriptDir\`n" +
                           '        \u914D\u5E03\u7269 (dist) \u3092\u3001\u3053\u306E\u30D5\u30A9\u30EB\u30C0 (mikke-launch.bat \u3068\u540C\u3058\u5834\u6240) \u306B\u7F6E\u3044\u3066\u304F\u3060\u3055\u3044\u3002')
                }
                # \u2605 Get-Content -Raw \u306F\u4F7F\u308F\u306A\u3044 (\u5171\u901A\u30AC\u30A4\u30C9 \xA716)\u30025.1 \u306F\u65E2\u5B9A\u30B3\u30FC\u30C9\u30DA\u30FC\u30B8
                #   (CP932) \u3067\u8AAD\u307F\u3001trail byte \u306E 0x5C \u304C\u30D0\u30C3\u30AF\u30B9\u30E9\u30C3\u30B7\u30E5\u3068\u3057\u3066\u6DF7\u5165\u3057\u3066
                #   \u6CE8\u5165\u3057\u305F JS \u304C\u9ED9\u3063\u3066\u58CA\u308C\u308B\u3002
                $js = [System.IO.File]::ReadAllText($bundleFile, [System.Text.Encoding]::UTF8)
                $srcLabel = "\u30D0\u30F3\u30C9\u30EB\u76F4\u633F\u3057 ($([math]::Round((Get-Item $bundleFile).Length / 1KB)) KB / \u66F4\u65B0\u306F launcher \u518D\u5B9F\u884C\u304C\u5FC5\u8981)"
            } else {
                $js = [System.IO.File]::ReadAllText($loaderFile, [System.Text.Encoding]::UTF8)
                $srcLabel = "\u30ED\u30FC\u30C0 (\u4E2D\u7D99\u30B5\u30FC\u30D0 127.0.0.1:$Port \u304B\u3089\u6BCE\u56DE\u30D0\u30F3\u30C9\u30EB\u3092\u53D6\u5F97)"
            }
            Write-Host "\u6CE8\u5165\u3057\u307E\u3059: $srcLabel" -ForegroundColor Cyan
            $res = $cdp.Eval($js, $false)
            if ($res -match '"exceptionDetails"') { throw "\u6CE8\u5165\u306B\u5931\u6557\u3057\u307E\u3057\u305F ($srcLabel): $res" }

            # \u2605 \u6CE8\u5165\u3067\u304D\u305F = \u753B\u9762\u304C\u51FA\u305F\u3001\u3067\u306F\u306A\u3044\u3002\u30D0\u30F3\u30C9\u30EB\u76F4\u633F\u3057\u306A\u3089\u8D77\u52D5\u306F\u540C\u671F\u7684\u3060\u304C\u3001
            #   \u30ED\u30FC\u30C0\u7D4C\u7531\u3060\u3068 SharePoint \u304B\u3089 **\u975E\u540C\u671F\u306B** \u53D6\u308A\u306B\u884C\u304D\u3001\u5931\u6557\u3057\u3066\u3082
            #   console.warn \u3059\u308B\u3060\u3051\u3002\u78BA\u8A8D\u3057\u306A\u3044\u3068\u300C\u30D6\u30E9\u30A6\u30B6\u306F\u4E0A\u304C\u308B\u304C\u753B\u9762\u304C\u51FA\u306A\u3044\u300D
            #   \u72B6\u614B\u306E\u307E\u307E\u300C\u8D77\u52D5\u3057\u307E\u3057\u305F\u300D\u3068\u8868\u793A\u3057\u3066\u3057\u307E\u3046\u3002
            Write-Host 'Mikke \u306E\u753B\u9762\u304C\u51FA\u308B\u306E\u3092\u5F85\u3063\u3066\u3044\u307E\u3059...' -ForegroundColor Cyan
            $waitJs = '(async()=>{for(var i=0;i<40;i++){' +
                      'if(document.getElementById("mikke-root"))return "ok";' +
                      'await new Promise(function(r){setTimeout(r,500);});}return "timeout";})()'
            $mounted = ''
            try {
                $wr = $cdp.Eval($waitJs, $true) | ConvertFrom-Json
                $mounted = [string]$wr.result.result.value
            } catch { $mounted = 'unknown' }

            if ($mounted -ne 'ok') {
                if ($useBundle) {
                    # \u76F4\u633F\u3057\u3067\u51FA\u306A\u3044\u306E\u306F\u3001\u30D0\u30F3\u30C9\u30EB\u81EA\u4F53\u304C\u5B9F\u884C\u6642\u30A8\u30E9\u30FC\u306B\u306A\u3063\u3066\u3044\u308B\u30B1\u30FC\u30B9\u3002
                    # \u30DA\u30FC\u30B8\u5185\u306B\u6B8B\u3063\u3066\u3044\u308B\u30A8\u30E9\u30FC\u3092\u62FE\u3063\u3066\u51FA\u3059\u3002
                    $errJs = '(function(){try{return (window.Mikke?"window.Mikke \u3042\u308A":"window.Mikke \u306A\u3057")' +
                             '+" / root="+(document.getElementById("mikke-root")?"\u3042\u308A":"\u306A\u3057");}' +
                             'catch(e){return "probe error: "+(e&&e.message||e);}})()'
                    $diag = ''
                    try {
                        $dr = $cdp.Eval($errJs, $false) | ConvertFrom-Json
                        $diag = [string]$dr.result.result.value
                    } catch { $diag = '(\u53D6\u5F97\u3067\u304D\u307E\u305B\u3093\u3067\u3057\u305F)' }
                    throw ("\u30D0\u30F3\u30C9\u30EB\u306F\u6CE8\u5165\u3067\u304D\u307E\u3057\u305F\u304C Mikke \u306E\u753B\u9762\u304C\u51FA\u307E\u305B\u3093\u3067\u3057\u305F\u3002\`n" +
                           "        $diag\`n" +
                           "        \u30D6\u30E9\u30A6\u30B6\u306E F12 \u2192 Console \u306B\u30A8\u30E9\u30FC\u304C\u51FA\u3066\u3044\u306A\u3044\u304B\u78BA\u8A8D\u3057\u3066\u304F\u3060\u3055\u3044\u3002")
                }
                # \u30ED\u30FC\u30C0\u306B\u713C\u304D\u8FBC\u307E\u308C\u3066\u3044\u308B\u30D0\u30F3\u30C9\u30EB\u914D\u7F6E\u30D1\u30B9\u3092\u53D6\u308A\u51FA\u3057\u3066\u3001\u5B9F\u969B\u306B\u53D6\u5F97\u3092\u8A66\u3059\u3002
                $libPath = '/Shared%20Documents/Mikke'
                $mLib = [regex]::Match($js, 'return r\\?r\\+"([^"]+)"')
                if ($mLib.Success) { $libPath = $mLib.Groups[1].Value }
                $diagJs = '(async()=>{try{' +
                          'var c=window._spPageContextInfo||{};' +
                          'var rel=(c.webServerRelativeUrl||"").replace(/\\/$/,"");' +
                          'var u=rel+"' + $libPath + '/mikke.bundle.js";' +
                          'var r=await fetch(u,{credentials:"same-origin",cache:"no-store"});' +
                          'var t=await r.text();' +
                          'return u+" -> HTTP "+r.status+" / "+t.length+" bytes";' +
                          '}catch(e){return "fetch error: "+(e&&e.message||e);}})()'
                $diag = ''
                try {
                    $dr = $cdp.Eval($diagJs, $true) | ConvertFrom-Json
                    $diag = [string]$dr.result.result.value
                } catch { $diag = '(\u53D6\u5F97\u3067\u304D\u307E\u305B\u3093\u3067\u3057\u305F)' }
                throw ("\u30ED\u30FC\u30C0\u306F\u6CE8\u5165\u3067\u304D\u307E\u3057\u305F\u304C Mikke \u306E\u753B\u9762\u304C\u51FA\u307E\u305B\u3093\u3067\u3057\u305F\u3002" +
                       "SharePoint \u4E0A\u306E\u30D0\u30F3\u30C9\u30EB\u914D\u7F6E\u3092\u78BA\u8A8D\u3057\u3066\u304F\u3060\u3055\u3044\u3002\`n" +
                       "        $diag\`n" +
                       "        HTTP 404 \u306A\u3089\u30C9\u30AD\u30E5\u30E1\u30F3\u30C8 \u30E9\u30A4\u30D6\u30E9\u30EA\u306E Mikke \u30D5\u30A9\u30EB\u30C0\u306B " +
                       "mikke.bundle.js / version.txt \u304C\u7F6E\u304B\u308C\u3066\u3044\u307E\u305B\u3093\u3002")
            }

            # \u2605 \u518D\u8AAD\u8FBC\u3057\u3066\u3082 Mikke \u304C\u623B\u308B\u3088\u3046\u306B\u3059\u308B\u3002
            #   Runtime.evaluate \u306F\u300C\u4ECA\u958B\u3044\u3066\u3044\u308B document\u300D\u306B\u3057\u304B\u52B9\u304B\u306A\u3044\u306E\u3067\u3001
            #   \u30DA\u30FC\u30B8\u3092\u518D\u8AAD\u8FBC\u3059\u308B\u3068 Mikke \u306F\u6D88\u3048\u308B\u3002CDP \u8D77\u52D5\u306B\u306F\u30D6\u30C3\u30AF\u30DE\u30FC\u30AF\u30EC\u30C3\u30C8\u304C
            #   \u7121\u3044\u305F\u3081\u3001\u6D88\u3048\u305F\u3089 mikke-launch.bat \u3092\u5B9F\u884C\u3057\u76F4\u3059\u3057\u304B\u623B\u3059\u624B\u6BB5\u304C\u7121\u304B\u3063\u305F
            #   (\u30D0\u30F3\u30C9\u30EB\u66F4\u65B0\u306F\u518D\u8AAD\u8FBC\u3059\u308B\u306E\u3067\u3001\u66F4\u65B0\u306E\u305F\u3073\u306B\u753B\u9762\u304C\u771F\u3063\u767D\u306B\u306A\u308B)\u3002
            #   Page.addScriptToEvaluateOnNewDocument \u306B\u767B\u9332\u3057\u3066\u304A\u304F\u3068\u3001\u4EE5\u964D\u305D\u306E
            #   \u30BF\u30D6\u3067\u958B\u304F document \u3059\u3079\u3066\u306B\u81EA\u52D5\u3067\u6D41\u3057\u8FBC\u307E\u308C\u308B\u3002CDP \u63A5\u7D9A\u3092\u5207\u3063\u305F\u5F8C
            #   (= launcher \u7D42\u4E86\u5F8C) \u3082\u6709\u52B9\u306A\u3053\u3068\u306F\u5B9F\u6E2C\u3067\u78BA\u8A8D\u6E08\u307F\u3002
            #   \u30AC\u30FC\u30C9: iframe \u306B\u306F\u5165\u308C\u306A\u3044 / SharePoint \u4EE5\u5916\u306E\u30B5\u30A4\u30C8\u3067\u306F\u4F55\u3082\u3057\u306A\u3044 /
            #          \u540C\u4E00 document \u3067\u4E8C\u91CD\u8D77\u52D5\u3057\u306A\u3044\u3002
            try {
                $origin = ([Uri]$webAbs).GetLeftPart([System.UriPartial]::Authority)
                $boot = '(function(){' +
                        'if(window.top!==window.self)return;' +
                        'if(location.origin!==' + [MikkeCdp]::JsonStr($origin) + ')return;' +
                        'if(window.__mikkeAutoBoot)return;window.__mikkeAutoBoot=true;' +
                        'function go(){try{' + $js + '}catch(e){console.error("[mikke] \u81EA\u52D5\u8D77\u52D5\u306B\u5931\u6557:",e);}}' +
                        'if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",go);else go();' +
                        '})();'
                $cdp.Send('Page.enable', '{}') | Out-Null
                $reg = $cdp.Send('Page.addScriptToEvaluateOnNewDocument',
                                 '{"source":' + [MikkeCdp]::JsonStr($boot) + '}')
                if ($reg -match '"identifier"') {
                    $autoBootRegistered = $true
                    Write-Host '\u518D\u8AAD\u8FBC\u3057\u3066\u3082 Mikke \u304C\u81EA\u52D5\u3067\u5FA9\u5E30\u3059\u308B\u3088\u3046\u306B\u3057\u307E\u3057\u305F\u3002' -ForegroundColor DarkGray
                } else {
                    Write-Host '\u6CE8\u610F: \u518D\u8AAD\u8FBC\u6642\u306E\u81EA\u52D5\u5FA9\u5E30\u3092\u767B\u9332\u3067\u304D\u307E\u305B\u3093\u3067\u3057\u305F (\u753B\u9762\u304C\u6D88\u3048\u305F\u3089 mikke-launch.bat \u3092\u518D\u5B9F\u884C\u3057\u3066\u304F\u3060\u3055\u3044)\u3002' -ForegroundColor Yellow
                }
            } catch {
                Write-Host "\u6CE8\u610F: \u518D\u8AAD\u8FBC\u6642\u306E\u81EA\u52D5\u5FA9\u5E30\u3092\u767B\u9332\u3067\u304D\u307E\u305B\u3093\u3067\u3057\u305F: $($_.Exception.Message)" -ForegroundColor Yellow
            }

            Write-Host ''
            Write-Host 'Mikke \u3092\u8D77\u52D5\u3057\u307E\u3057\u305F (\u30D6\u30C3\u30AF\u30DE\u30FC\u30AF\u30EC\u30C3\u30C8\u4E0D\u8981)\u3002\u3053\u306E\u30A6\u30A3\u30F3\u30C9\u30A6\u306E\u30D6\u30E9\u30A6\u30B6\u3092\u305D\u306E\u307E\u307E\u304A\u4F7F\u3044\u304F\u3060\u3055\u3044\u3002' -ForegroundColor Green
            $cdpDone = $true

            # \u2605 \u518D\u8AAD\u8FBC\u306B\u5099\u3048\u3066\u5E38\u99D0\u3059\u308B\u3002
            #   Page.addScriptToEvaluateOnNewDocument \u306E\u767B\u9332\u304C\u6709\u52B9\u306A\u306E\u306F
            #   **CDP \u63A5\u7D9A\u304C\u751F\u304D\u3066\u3044\u308B\u9593\u3060\u3051** (\u5207\u65AD\u3059\u308B\u3068 Chromium \u304C\u7834\u68C4\u3059\u308B\u3002\u5B9F\u6E2C\u3067\u78BA\u8A8D)\u3002
            #   \u63A5\u7D9A\u3092\u4FDD\u3063\u3066\u3044\u308B\u9593\u306F\u3001F5 \u3067\u3082\u30D0\u30F3\u30C9\u30EB\u66F4\u65B0\u306E\u518D\u8AAD\u8FBC\u3067\u3082 Mikke \u304C\u81EA\u52D5\u3067\u623B\u308B\u3002
            #   \u3053\u306E\u30A6\u30A3\u30F3\u30C9\u30A6\u3092\u9589\u3058\u3066\u3082 Mikke \u81EA\u4F53\u306F\u52D5\u304D\u7D9A\u3051\u308B (\u81EA\u52D5\u5FA9\u5E30\u3060\u3051\u6B62\u307E\u308B)\u3002
            if ($autoBootRegistered) {
                Write-Host '\u3053\u306E\u30A6\u30A3\u30F3\u30C9\u30A6\u306F\u958B\u3044\u305F\u307E\u307E\u306B\u3057\u3066\u304F\u3060\u3055\u3044\u3002\u9589\u3058\u308B\u3068\u300C\u518D\u8AAD\u8FBC\u3057\u305F\u3089 Mikke \u304C\u623B\u308B\u300D\u6A5F\u80FD\u3060\u3051\u304C\u6B62\u307E\u308A\u307E\u3059 (Mikke \u81EA\u4F53\u306F\u52D5\u304D\u7D9A\u3051\u307E\u3059)\u3002' -ForegroundColor DarkGray
                while ($true) {
                    Start-Sleep -Seconds 5
                    $alive = $false
                    try { if ($cdp.Eval('1', $false)) { $alive = $true } } catch { $alive = $false }
                    if (-not $alive) { break }
                }
                Write-Host '\u30D6\u30E9\u30A6\u30B6\u304C\u9589\u3058\u3089\u308C\u305F\u305F\u3081\u7D42\u4E86\u3057\u307E\u3059\u3002' -ForegroundColor DarkGray
            }
        } catch {
            Write-Host "CDP \u8D77\u52D5\u306B\u5931\u6557\u3057\u307E\u3057\u305F: $($_.Exception.Message)" -ForegroundColor Yellow
            Write-Host '\u5F93\u6765\u30D5\u30ED\u30FC (\u30D6\u30C3\u30AF\u30DE\u30FC\u30AF\u30EC\u30C3\u30C8) \u306B\u5207\u308A\u66FF\u3048\u307E\u3059\u3002' -ForegroundColor Yellow
        }
    }
}
